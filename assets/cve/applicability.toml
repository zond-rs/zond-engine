# Which CVEs keyed to a server product can reach the service a scan found.
#
# Hand-written. NVD and the distributions key a vulnerability to the package, so
# a flaw in OpenSSH's client, in its agent or in a tool only a logged-in user
# runs is charged to every listening sshd. Each entry here says where the flaw
# lives, for one CVE and one `vendor:product`:
#
#   service        the listening daemon, reachable over the network as shipped
#   client         only the client programs: ssh, scp, sftp, ssh-agent,
#                  ssh-add, ssh-keygen, ApacheBench
#   local          only someone who already holds an account on the host, or
#                  can write its configuration
#   configuration  only a server set up in a way it is not by default, named
#                  in `requires`: a directive, or for Apache HTTP Server the
#                  module that must be loaded
#
# Conservative by rule, because an entry that is wrongly `client` hides a real
# server vulnerability: `service` unless the record makes plain that the flaw
# is somewhere else. A flaw specific to one operating system stays `service`,
# since that is a condition on the platform and not on the daemon.
#
# "By default" means OpenSSH's own sshd_config, and for Apache HTTP Server the
# modules its stock httpd.conf or Debian's packaging loads without being asked.
# A generic mod_ssl flaw is `service`: a scan sees whether a port speaks TLS,
# and one that does has mod_ssl loaded.
#
# Every OpenSSH CVE the shipped catalogue carries is classified, and every
# critical or high one for Apache HTTP Server; the tests beside the loader
# hold both lists to the catalogue, so regenerating it names what is new. The
# reasons are this project's own summaries.

