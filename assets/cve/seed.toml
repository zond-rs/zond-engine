# The CVE correlation seed.
#
# Read through `Catalogue::embedded`, which supplies the `id` and `version` this
# document deliberately does not carry: `zond:cve-kev` is reserved, so only the
# reader that knows it is loading the shipped seed may stamp it. A catalogue
# somebody else writes names itself, and `Catalogue::read` refuses one that
# reaches for this namespace.
#
# A hand-picked starter set of well-known, network-reachable vulnerabilities,
# keyed by the CPE vendor and product a service identification produces. It
# exists to exercise the correlator, not to be complete: the full CISA KEV
# catalogue (~1,300 entries) is meant to compile in here later, the way the
# fingerprint corpus does, once its data is on hand.
#
# Each entry matches a service CPE whose `vendor` and `product` equal its own
# (case-insensitively) and whose version satisfies `affected` — a comma-joined
# list of `<op> <version>` clauses (`<`, `<=`, `>`, `>=`, `==`), all of which
# must hold, or `*` for any version.
#
# The `vendor` and `product` of every entry are the exact identities the
# fingerprint corpus emits for that software — `apache:http_server`,
# `openbsd:openssh`, `vsftpd_project:vsftpd` — so a real scan of a
# version-revealing banner fires, not a hypothetical one.
#
# A match is reported at `probable` confidence, never `certain`: a version string
# can be right while the fix is backported, so a version-matched finding is
# *potentially affected, unverified*.

[[vulnerability]]
cve         = "CVE-2021-41773"
title       = "Apache HTTP Server path traversal and RCE"
severity    = "critical"
vendor      = "apache"
product     = "http_server"
affected    = "== 2.4.49"
cwe         = 22
remediation = "Upgrade Apache HTTP Server to 2.4.51 or later."

[[vulnerability]]
cve         = "CVE-2024-6387"
title       = "OpenSSH signal-handler race condition (regreSSHion)"
severity    = "critical"
vendor      = "openbsd"
product     = "openssh"
affected    = ">= 8.5, < 9.8"
cwe         = 364
remediation = "Upgrade OpenSSH to 9.8p1 or later."

[[vulnerability]]
cve         = "CVE-2019-10149"
title       = "Exim deliver_message() command injection"
severity    = "critical"
vendor      = "exim"
product     = "exim"
affected    = ">= 4.87, <= 4.91"
cwe         = 78
remediation = "Upgrade Exim to 4.92 or later."

[[vulnerability]]
cve         = "CVE-2015-3306"
title       = "ProFTPD mod_copy unauthenticated file copy"
severity    = "high"
vendor      = "proftpd"
product     = "proftpd"
affected    = ">= 1.3.5, < 1.3.5a"
cwe         = 264
remediation = "Upgrade ProFTPD to 1.3.5a or later, or disable mod_copy."

[[vulnerability]]
cve         = "CVE-2011-2523"
title       = "vsftpd 2.3.4 backdoor command execution"
severity    = "critical"
vendor      = "vsftpd_project"
product     = "vsftpd"
affected    = "== 2.3.4"
cwe         = 78
remediation = "Replace the backdoored 2.3.4 build with a vsftpd release from a trusted source."
