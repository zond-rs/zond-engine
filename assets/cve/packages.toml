  { series = "7", package = "tomcat7" },
  { series = "8", package = "tomcat8" },
  { series = "9", package = "tomcat9" },
  { series = "10", package = "tomcat10" },
  { series = "11", package = "tomcat11" },
]
debian = [
  { series = "6", package = "tomcat6" },
  { series = "7", package = "tomcat7" },
  { series = "8", package = "tomcat8" },
  { series = "9", package = "tomcat9" },
  { series = "10", package = "tomcat10" },
  { series = "11", package = "tomcat11" },
]

