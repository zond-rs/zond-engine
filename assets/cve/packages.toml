# Which distribution source package builds each product the fingerprint
# corpus can put a version to.
#
# A distribution publishes its security verdicts per source package: Debian
# and Ubuntu say whether `openssh` in 14.04 carries a fix, not whether
# `openbsd:openssh` does. This table is the join between the two vocabularies,
# the CPE `vendor:product` a service identification produces and the name the
# distributor files its advisories under, so a banner that names a
# distribution build can be judged against that distribution's own data.
#
# Hand-written and maintained with the fingerprint corpus: a test fails when
# the corpus can version a product that is neither mapped here nor listed as
# not packaged, and when an entry here or on that list names a product the
# corpus cannot version. The names were chosen against the source packages the
# distributors' own advisory feeds file records under, release by release.
# This file is this crate's own work and holds no third-party data: no
# advisory, verdict or version from any feed, only package names.
#
# ## The shape of an entry
#
# One table per product, one key per distributor (`ubuntu`, `debian`). A
# distributor that is absent does not package the product.
#
# A plain string is the source package in every release:
#
#     [product."openbsd:openssh"]
#     ubuntu = "openssh"
#
# Where a release ships several series of one product side by side, each under
# its own source package (`php7.4`, `mysql-8.0`, `tomcat9` and `tomcat10` in
# one release), the value is a list of rules, tried in order, the first that
# holds naming the package:
#
#     ubuntu = [
#       { series = "9", package = "tomcat9" },
#       { series = "10", package = "tomcat10" },
#     ]
#
# `series` holds when the upstream version starts with it and continues with
# anything but a digit, so `9` holds for `9.0.58` and not for `90.1`, and `7.4`
# for `7.4.3`. `release` holds for that release alone, written as the
# distributor numbers it (`14.04`, `12`), never as a codename. A rule with
# neither holds always and can only come last. A product whose rules all fail
# for a version has no package there, which is the honest answer when the
# series is one the distributor never shipped.

[product."acme:mini_httpd"]
ubuntu = "mini-httpd"
debian = "mini-httpd"

[product."acme:thttpd"]
ubuntu = "thttpd"
debian = "thttpd"

[product."aiohttp:aiohttp"]
