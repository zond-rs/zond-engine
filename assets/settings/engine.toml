# zond engine settings
#
# Every key below is commented out, so this file as written changes nothing.
# Uncomment what you want and it applies to every scan.
#
# Everything here changes what a scan puts on the wire. How a scan is *displayed*
# — a banner, output density, whether keystrokes are listened for — is not the
# engine's business and has no keys in this file. Whatever program you run keeps
# its own settings in its own file.
#
# Layering, each overriding the one before:
#
#   built-in defaults  ->  /etc/zond/engine.toml  ->  this file  ->  a profile
#
# A layer speaks only about the keys it mentions. Saying nothing is not the same
# as setting a default, which is what makes it possible to override a
# system-wide value back to what it was.


# ─── Defaults ─────────────────────────────────────────────────────────────────
#
# Applied to every scan.

[defaults]

# How hard a scan tries before it accepts silence as an answer. Every probing
# path has its own schedule tuned to what its protocol requires; this scales
# those rather than replacing them.
#
#   single    one probe per target, no repeats. For address-space-scale sweeps.
#   fast      fewer attempts, less patience. For a network known to be healthy.
#   balanced  the default.
#   thorough  more attempts, more patience, no shortcuts on silent hosts.
#
# effort = "balanced"

# Replaces the attempt budget outright, whatever `effort` implies. 1 disables
# retransmission entirely.
#
# max_attempts = 3

# Multiplies how long the scan is willing to wait. Does not touch the shortest
# timeout a protocol allows: that floor is not a preference, it is what the
# protocol costs.
#
# timeout_scale = 1.0

# Whether a host that has answered nothing at all may have its remaining probe
# budget cut. Turning this off spends the full budget on every port of every
# silent address, which is thorough and expensive.
#
# dampen_silent_hosts = true

# The fastest a scan may put probes on the wire, in probes per second.
#
# This is a coverage control before it is a politeness one. A probe's chance of
# being answered falls as the rate rises: on a policed path a burst loses most
# of its first attempt. Lowering the rate buys coverage on the first attempt;
# raising it trades coverage for the time a large range takes to emit.
#
# It is a ceiling on a TCP port scan rather than its pace. That scan works out
# how fast each target will answer and settles there, which is almost always
# well below any rate worth writing down. Set this for a target that must not be
# pushed at all; the discovery sweep and the UDP port scan are paced by it
# directly, because neither is given evidence it could adapt on.
#
# max_probe_rate = 20000

# The slowest the scan may settle at, in probes per second.
#
# The knob for a plan large enough that finishing it is in doubt. A scan given
# scan_timeout can spend the whole budget on a fraction of its targets and report
# the rest as never asked; a floor is what makes a wall-clock bound and a large
# range compatible.
#
# It reaches the same scanners max_probe_rate does and means what the rate means
# to each: a floor under the pace of the discovery sweep and the UDP port scan,
# and a floor under the ceiling of a TCP port scan, which still paces itself on
# what its targets are answering. Nothing here overrides that. A floor above a
# max_probe_rate set alongside it does not lift the ceiling.
#
# min_probe_rate = 500

# The shortest gap between two probes aimed at one host, in whole milliseconds.
#
# The knob for what you actually know about a target: this appliance falls over
# above twenty probes a second, or this sensor fires at more than one every
# hundred milliseconds. Both of those are per source and destination, which is
# the one shape max_probe_rate cannot express, since the setting that spaces
# probes at one host also throttles the scan across the whole range.
#
# A probe held by this is deferred, not dropped, so a scan spaced slower than
# its plan is large takes longer rather than asking less. Set scan_timeout
# alongside it and the report names the hosts the budget left part-scanned.
#
# The plan's keyed order does not make this redundant. A scan of many hosts
# already interleaves them, so each host's share of the rate falls out low; that
# is arithmetic rather than a bound, and it does nothing for a scan of a single
# address, which is usually what you are running when you are worried about the
# target.
#
# host_probe_interval = 100

# How long the scan may spend on one host, in whole seconds.
#
# The clock starts on the first probe aimed at an address and covers the port
# scan and every pass after it. Once it runs out the host is left with what the
# scan already has, and the report names the address as one it left early, so a
# short port list is not read as a quiet machine.
#
# This is the bound for a host that answers slowly rather than one that answers
# nothing: silence already costs a known number of probes, because the retry
# schedule ends. A tarpit costs whatever it decides to.
#
# host_timeout = 300

# How long the whole scan may run, in whole seconds.
#
# The bound that makes an unattended run safe to schedule. Everything else here
# bounds a probe, a retry or a host, and none of those bounds the run: a range
# with enough slow addresses in it has no finishing time worked out in advance.
#
# When it runs out the scan winds down where it stands and still writes its
# report, with every scanner recording `timed_out` as the reason it stopped.
#
# scan_timeout = 3600

# Whether to establish what each TLS port accepts, rather than only what one
# handshake negotiated.
#
# Service detection completes one handshake per TLS port and records the version
# and cipher that came out of it. This offers the endpoint each version in turn
# and narrows the cipher list until it stops answering, so the report says what
# the endpoint *would* negotiate: whether it still accepts TLS 1.0, RC4, 3DES or
# an export cipher. That is the question a PCI scan or an internal audit asks,
# and one handshake cannot answer it.
#
# The cost is connections. A current server costs about a dozen; one accepting
# everything under three versions costs a few dozen. Each is a bare TCP
# connection carrying one ClientHello and torn down before any handshake
# completes, so no session is established and no application sees one. The
# target's connection log sees every one of them.
#
# Worth setting host_timeout alongside this on anything unattended.
#
# tls_enumeration = false

# Which segment a TCP port probe carries, and so what its answers mean.
#
#   syn     the only technique that identifies an open port positively.
#   fin     |
#   null    |  answered negatively, by the RST only a closed port must send.
#   xmas    |  a filter that blocks connections often passes these.
#   maimon  |
#   ack     tells filtered from unfiltered, never says which is open.
#
# Only `syn` works without raw sockets. Against a stack that answers every flag
# probe with a RST — Windows, many Cisco devices — fin, null, xmas and maimon
# report every port closed, which is not merely useless but confidently wrong.
#
# tcp_technique = "syn"

# Which chunk an SCTP port probe carries, and so what its answers mean.
#
#   init         the only technique that names an open SCTP port. A listener
#                accepts with an init-ack and a closed port refuses with an
#                abort, so silence is a filter.
#   cookie-echo  a cookie no endpoint minted. Only a closed port answers, with
#                an abort; a listener fails to authenticate it and says nothing,
#                so open and filtered are indistinguishable here.
#
# Both need raw sockets. Reach for cookie-echo when an init scan came back
# entirely filtered and the question is whether the filter is aimed at SCTP or
# only at the chunk a scan is expected to send.
#
# sctp_technique = "init"

# How raw probes are placed on the wire.
#
#   auto        a raw Layer-4 socket on Unix, Layer-2 frames on Windows.
#   raw_socket  force the socket, whatever the platform.
#   ethernet    force self-built frames, bypassing the host IP stack and the
#               local firewall with it. Cannot reach loopback or tunnels.
#
# send_mode = "auto"

# The ports a scan covers when the caller names none. Same grammar as the
# command line: `u:` prefixes a UDP port, `-` makes a range, and a range may
# leave off either end — `-1024`, `9000-`, or a bare `-` for every port there
# is.
#
# Left unset, a scan probes the thousand TCP ports the engine ranks as most
# likely to be listening — which is a better default than any range, so set this
# only when you know which ports you care about.
#
# default_ports = "22, 80, 443, 445, 3389"

# Forbid the scan from generating any DNS traffic — no A, AAAA or PTR queries.
#
# no_dns = false

# Mask hostnames and hardware addresses in exported output. For a report going
# to somebody who does not need to know which device is which.
#
# redact = false

# Addresses no scan reading this file may probe, whatever it is pointed at.
#
# This is the one key that cannot widen a scan, which is why a file is allowed
# to set it at all. Put the range here that must never be touched — the
# cardholder segment, the fragile PLC, the provider's monitoring hosts — and no
# scan run from this machine will address a packet at it or record a finding
# about it. What it cannot promise is that a machine on your own segment never
# sees a broadcast probe; a reply from an excluded address is dropped, but an
# ARP request goes to the whole link. Do not sweep the segment if that matters.
#
# Layers add up rather than replacing each other. A range set in
# /etc/zond/engine.toml stays excluded when this file names its own, and both
# stay excluded when a profile or the command line adds a third. That is the
# opposite of every other key here, and it is deliberate: an exclusion an
# administrator wrote should not be droppable by a file below it.
#
# Addresses, inclusive ranges and CIDR blocks. Not names, and not `lan`: this
# file is read on every scan and both of those mean something different each
# time. Pass those on the command line instead, where they are resolved at the
# moment they are used.
#
# exclude = ["198.51.100.0/24", "192.0.2.10-20", "2001:db8:dead::/48"]

# Ports no scan reading this file may probe on any target: not the port scan,
# not the liveness check before it, and nothing after it. Written the way a
# port list is, `u:` for UDP and `s:` for SCTP. It adds up across layers the
# way `exclude` does.
#
# A printer's raw-print ports, 9100-9107, are already sent nothing but the
# probe that finds them open; name them here to send them nothing at all, at
# the cost of not finding the printers.
#
# exclude_ports = "9100-9107"


# ─── Profiles ─────────────────────────────────────────────────────────────────
#
# Named sets of overrides, layered on top of [defaults] when one is selected.
# A profile speaks only about the keys it mentions; everything else comes from
# the defaults above.
#
# Three worked examples. Uncomment, rename, or replace them entirely.

# [profiles.stealth]
# tcp_technique = "fin"
# max_probe_rate = 200
# host_probe_interval = 250
# effort = "thorough"
# no_dns = true

# [profiles.sweep]
# effort = "single"
# max_probe_rate = 50000
# min_probe_rate = 2000
# default_ports = "80, 443"

# [profiles.ci]
# effort = "fast"
# no_dns = true
