# MongoDB reachable without authentication. One OP_MSG carrying a listDatabases
# command against the admin database: an open instance returns the catalogue, a
# secured one answers an authentication error instead. The payload is a fixed
# wire message written out byte for byte the way the SNMP probe is, with the
# command and database names left as literal text inside it.
#
# The match is `sizeOnDisk`, a field the successful listing carries per database,
# rather than `databases`: a secured server's error reads "command listDatabases
# requires authentication", which contains the substring `databases` and would
# otherwise read as a hit.

[detection]
id      = "mongodb-unauth"
version = "1.0.0"
title   = "MongoDB reachable without authentication"

[detection.when]
service  = "mongodb"
protocol = "tcp"

[detection.capabilities]
class      = "active-benign"
speak      = "target"
max_bytes  = 8192
max_millis = 3000

[[step]]
# OP_MSG (opcode 2013): { listDatabases: 1, $db: "admin" }
send   = '\x3c\x00\x00\x00\x01\x00\x00\x00\x00\x00\x00\x00\xdd\x07\x00\x00\x00\x00\x00\x00\x00\x27\x00\x00\x00\x10listDatabases\x00\x01\x00\x00\x00\x02$db\x00\x06\x00\x00\x00admin\x00\x00'
expect = "sizeOnDisk"                                 # the catalogue came back, not an auth error

  [[step.finding]]
  when         = "matched"
  severity     = "high"
  summary      = "MongoDB listed its databases without authentication"
  detail       = "An unauthenticated listDatabases returned the database catalogue; the instance is reachable with no credentials."
  references   = [{ cwe = 306 }]
  excerpt_from = "$response"
