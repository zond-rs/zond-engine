# Oracle TNS listener reachable. The listener answers a TNS connect packet before
# any authentication, which both proves an Oracle database is exposed on the
# network and is the surface older listeners leaked version and service names
# through. The reply is a TNS packet whose type byte marks an accept or a
# redirect. A single connect packet; it opens no session.
#
# The payload is a single-quoted TOML literal string so its byte escapes reach
# the interpreter rather than the TOML parser.

[detection]
id      = "oracle-tns-info"
version = "1.0.0"
title   = "Oracle TNS listener reachable"

[detection.when]
service  = "oracle"
protocol = "tcp"

[detection.capabilities]
class      = "active-benign"
speak      = "target"
max_bytes  = 8192
max_millis = 3000

[[step]]
send   = '\x00\x3a\x00\x00\x01\x00\x00\x00\x01\x39\x01\x2c\x00\x00\x00\x08\x00\x00\x7f\xff\x86\x0e\x00\x00\x01\x00\x00\x1d\x00\x3a\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00'
expect = '(?s)^\x00[\x08-\x40]\x00\x00\x02\x00\x00\x00'
  [[step.finding]]
  when         = "matched"
  severity     = "info"
  summary      = "Oracle TNS listener answered a connect packet"
  detail       = "The listener replied to a TNS connect with no authentication, so an Oracle database is reachable directly on the network and should sit behind access controls."
  references   = [{ cwe = 200 }]
  excerpt_from = "$response"
