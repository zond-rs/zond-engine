# Kubelet serving the pod list without authentication. The read-only port (10255)
# answers /pods to anyone, and the full port (10250) does too where
# anonymous-auth is on; either returns the pod specifications, which carry the
# environment and mounted secrets of everything on the node. A single read-only
# GET; `speaks = "http"` reaches 10250's TLS through the handshake.

[detection]
id      = "kubelet-pods-exposed"
version = "1.0.0"
title   = "Kubelet pod list exposed without authentication"

[detection.when]
speaks   = "http"
protocol = "tcp"

[detection.capabilities]
class      = "active-benign"
speak      = "target"
max_bytes  = 65536
max_millis = 4000

[[step]]
send   = "GET /pods HTTP/1.1\r\nHost: {host}\r\nAccept: */*\r\nConnection: close\r\n\r\n"
expect = ["HTTP/[0-9.]+ 200", "PodList"]
  [[step.finding]]
  when         = "matched"
  severity     = "high"
  summary      = "Kubelet served the pod list without authentication"
  detail       = "GET /pods returned the node's pod specifications with no credentials, disclosing the environment and mounted secrets of the workloads on it."
  references   = [{ cwe = 306 }]
  excerpt_from = "$response"
