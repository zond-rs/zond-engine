# SMBv1 still enabled. SMBv1 is the obsolete file-sharing dialect behind
# EternalBlue and the WannaCry and NotPetya outbreaks, retired by every current
# Windows. The probe offers the oldest dialect; a server that answers with an
# SMBv1 header (0xff 'SMB') rather than upgrading to SMB2 (0xfe 'SMB') still speaks
# it. One negotiate; nothing authenticates.
#
# The payload is a single-quoted TOML literal string so its byte escapes reach
# the interpreter rather than the TOML parser.

[detection]
id      = "smbv1-enabled"
version = "1.0.0"
title   = "SMBv1 is enabled"

[detection.when]
service  = "smb"
protocol = "tcp"

[detection.capabilities]
class      = "active-benign"
speak      = "target"
max_bytes  = 4096
max_millis = 3000

[[step]]
send   = '\x00\x00\x00\x2f\xff\x53\x4d\x42\x72\x00\x00\x00\x00\x00\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x50\x43\x20\x4e\x45\x54\x57\x4f\x52\x4b\x20\x50\x52\x4f\x47\x52\x41\x4d\x20\x31\x2e\x30\x00'
expect = '(?s)^\x00\x00\x00.\xff\x53\x4d\x42\x72\x00\x00\x00\x00'
  [[step.finding]]
  when         = "matched"
  severity     = "high"
  summary      = "The server negotiated the obsolete SMBv1 dialect"
  detail       = "The server answered the negotiate with an SMBv1 header rather than upgrading to SMB2, so the dialect behind EternalBlue and WannaCry is still enabled and should be disabled."
  references   = [{ cwe = 477 }]
  excerpt_from = "$response"
