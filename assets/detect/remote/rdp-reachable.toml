# Remote Desktop reachable on the network. RDP is a favourite target for
# credential stuffing, BlueKeep-class exploits and ransomware ingress, so an
# exposed one is a major attack surface regardless of its configuration. The
# probe sends an X.224 connection request; a connection-confirm reply is the
# finding. One handshake; nothing authenticates.
#
# The payload is a single-quoted TOML literal string so its byte escapes reach
# the interpreter rather than the TOML parser.

[detection]
id      = "rdp-reachable"
version = "1.0.0"
title   = "Remote Desktop (RDP) reachable"

[detection.when]
service  = "rdp"
protocol = "tcp"

[detection.capabilities]
class      = "active-benign"
speak      = "target"
max_bytes  = 4096
max_millis = 3000

[[step]]
send   = '\x03\x00\x00\x13\x0e\xe0\x00\x00\x00\x00\x00\x01\x00\x08\x00\x03\x00\x00\x00'
expect = '(?s)^\x03\x00\x00.[\x06\x0e]\xd0'
  [[step.finding]]
  when         = "matched"
  severity     = "medium"
  summary      = "RDP answered a connection request"
  detail       = "The host completed the X.224 handshake, so Remote Desktop is reachable; RDP exposed to untrusted networks is a leading path for credential stuffing, BlueKeep-class exploits and ransomware."
  references   = [{ cwe = 284 }]
  excerpt_from = "$response"
