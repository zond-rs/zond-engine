# A CORS policy that reflects the request Origin and allows credentials. A
# server that echoes an arbitrary Origin back in Access-Control-Allow-Origin and
# also sets Access-Control-Allow-Credentials: true lets any site a victim visits
# read authenticated responses cross-origin. The probe sends an Origin the
# server has no reason to trust; a policy that reflects it is the finding. A
# single read-only GET.

[detection]
id      = "cors-reflected-credentials"
version = "1.0.0"
title   = "CORS reflects an arbitrary Origin with credentials allowed"

[detection.when]
speaks   = "http"
protocol = "tcp"

[detection.capabilities]
class      = "active-benign"
speak      = "target"
max_bytes  = 16384
max_millis = 3000

[[step]]
send   = "GET / HTTP/1.1\r\nHost: {host}\r\nOrigin: https://zond-cors-probe.example\r\nAccept: */*\r\nConnection: close\r\n\r\n"
expect = ['(?im)^Access-Control-Allow-Origin:\s*https://zond-cors-probe\.example', '(?im)^Access-Control-Allow-Credentials:\s*true']
  [[step.finding]]
  when         = "matched"
  severity     = "high"
  summary      = "CORS reflected an untrusted Origin and allowed credentials"
  detail       = "The server echoed an arbitrary request Origin in Access-Control-Allow-Origin with Access-Control-Allow-Credentials: true, so any origin can read authenticated cross-origin responses."
  references   = [{ cwe = 942 }]
  excerpt_from = "$response"
