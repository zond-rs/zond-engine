# An exposed .git directory. When a web root is a working copy and the server
# serves dotfiles, /.git/HEAD is fetchable, and from it the whole repository —
# source, history, and any secret ever committed — can be reconstructed. The HEAD
# file names a ref, which an ordinary page never does, so the match is specific.

[detection]
id      = "http-git-exposed"
version = "1.0.0"
title   = "Exposed .git directory"

[detection.when]
speaks   = "http"                                     # any web server, over http or ssl/http
protocol = "tcp"

[detection.capabilities]
class      = "active-benign"
speak      = "target"
max_bytes  = 16384
max_millis = 4000

[[step]]
send   = "GET /.git/HEAD HTTP/1.1\r\nHost: {host}\r\nAccept: */*\r\nConnection: close\r\n\r\n"
expect = ["HTTP/[0-9.]+ 200", "ref: refs/"]               # a real git HEAD, not a catch-all 200

  [[step.finding]]
  when         = "matched"
  severity     = "high"
  summary      = "The .git directory is served over HTTP"
  detail       = "GET /.git/HEAD returned a git ref, so the repository is downloadable: source, history and any committed secret."
  references   = [{ cwe = 538 }]                       # File/Directory Information Exposure
  remediation  = "Deny access to .git under the web root, or move the working copy out of it."
  excerpt_from = "$response"
