# A host-level detection. It concludes something no single port can: Kerberos,
# LDAP, and SMB open together are a domain controller, where each port on its own
# is just a service. The [detection.host] gate is what marks this a host detection
# rather than a per-port flow or module.

[detection]
id      = "domain-controller"
version = "1.0.0"
title   = "Windows domain controller"

[detection.host]
ports_open = [88, 389, 445]

[[finding]]
severity = "info"
# The summary is the conclusion in a sentence; the title is what a report names
# it. Without the split the sentence becomes the title, and a line that has to
# sit in a column beside a severity and a port has no room for one.
title    = "Windows domain controller"
summary  = "Kerberos, LDAP and SMB are open together, the signature of a domain controller"
detail   = "Ports 88 (Kerberos), 389 (LDAP) and 445 (SMB) all answer, the set a domain controller presents together."
