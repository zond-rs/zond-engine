# SMB signing not required. When a server does not require message signing, an
# attacker on the path can relay an authentication to it and act as the victim,
# the basis of NTLM relay attacks. The SMB2 negotiate response carries a security
# mode whose "signing required" bit is clear on such a server. One negotiate; it
# authenticates nothing.
#
# The negotiate is the one the SMB analyzer sends, byte for byte: every dialect
# from 2.0.2 to 3.1.1 and the preauthentication integrity context MS-SMB2
# requires beside 3.1.1, so the dialect and the security mode read here are the
# ones the service is reported with. Only a negotiate that succeeded is read:
# the pattern holds the status to zero, the command to NEGOTIATE and the body to
# the response's structure size before it looks at the signing bits.
#
# The payload is a single-quoted TOML literal string so its byte escapes reach
# the interpreter rather than the TOML parser.

[detection]
id      = "smb-signing-not-required"
version = "1.0.0"
title   = "SMB signing is not required"

[detection.when]
service  = "smb"
protocol = "tcp"

[detection.capabilities]
class      = "active-benign"
speak      = "target"
max_bytes  = 4096
max_millis = 3000

[[step]]
send   = '\x00\x00\x00\x9e\xfe\x53\x4d\x42\x40\x00\x00\x00\x00\x00\x00\x00\x00\x00\x1f\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x24\x00\x05\x00\x01\x00\x00\x00\x00\x00\x00\x00\x7a\x6f\x6e\x64\x2d\x73\x6d\x62\x32\x2d\x63\x6c\x69\x65\x6e\x74\x70\x00\x00\x00\x01\x00\x00\x00\x02\x02\x10\x02\x00\x03\x02\x03\x11\x03\x00\x00\x01\x00\x26\x00\x00\x00\x00\x00\x01\x00\x20\x00\x01\x00\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a\x5a'
expect = '(?s)^\x00.{3}\xfe\x53\x4d\x42.{4}\x00\x00\x00\x00\x00\x00.{50}\x41\x00[\x00\x01]\x00'
  [[step.finding]]
  when         = "matched"
  severity     = "medium"
  summary      = "SMB negotiated with signing not required"
  detail       = "The SMB2 negotiate response leaves the signing-required bit clear, so an attacker on the path can relay an authentication to this host and act as the victim (NTLM relay)."
  references   = [{ cwe = 290 }]
  excerpt_from = "$response"
