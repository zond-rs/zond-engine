# A phpinfo() page left reachable. phpinfo() prints the full PHP configuration,
# the loaded modules, environment variables and absolute paths, which together
# map the host for an attacker. The page keeps no fixed name, so a few
# conventional ones are tried in turn; a served one answers 200 with the
# phpinfo() heading its output always carries. One read-only GET per name.

[detection]
id      = "phpinfo-exposed"
version = "1.0.0"
title   = "phpinfo() page exposed"

[detection.when]
speaks   = "http"
protocol = "tcp"

[detection.capabilities]
class           = "active-benign"
speak           = "target"
max_bytes       = 65536
max_millis      = 3000
max_connections = 4

[[step]]
for_each = { var = "path", in = ["/phpinfo.php", "/info.php", "/phpinfo", "/php.php"] }
on_no_match = "continue"
send     = "GET {path} HTTP/1.1\r\nHost: {host}\r\nAccept: */*\r\nConnection: close\r\n\r\n"
expect   = ["HTTP/[0-9.]+ 200", 'phpinfo\(\)']
  [[step.finding]]
  when         = "matched"
  severity     = "medium"
  summary      = "A phpinfo() page was served without authentication"
  detail       = "GET {path} returned phpinfo() output, disclosing the PHP configuration, loaded modules, environment variables and absolute paths of the host."
  references   = [{ cwe = 200 }]
  excerpt_from = "$response"
