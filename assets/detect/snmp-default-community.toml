# SNMP reachable with a default community string. One probe per community: a
# complete SNMPv2c GetRequest for sysDescr.0 (OID 1.3.6.1.2.1.1.1.0), sent with
# the community under test. An agent that accepts the community answers with a
# GetResponse PDU (tag 0xa2); one that does not stays silent, so a reply tagged
# 0xa2 is the community being accepted.
#
# The community changes the length octets of the outer SEQUENCE and the
# community OCTET STRING, so the packets cannot share one interpolated template
# and are written out per community instead. The payloads are single-quoted TOML
# literal strings so their `\x` byte escapes stay literal for the interpreter
# rather than being read by the TOML parser.

[detection]
id      = "snmp-default-community"
version = "1.0.0"
title   = "SNMP reachable with a default community string"

[detection.when]
service  = "snmp"
protocol = "udp"

[detection.capabilities]
class           = "active-benign"   # read-only SNMP GET of sysDescr; no SET, nothing mutated
speak           = "target"
max_bytes       = 32768
max_millis      = 3000
max_connections = 4                 # one datagram per community

[[step]]                            # community: public
send        = '\x30\x29\x02\x01\x01\x04\x06public\xa0\x1c\x02\x04\x00\x00\x00\x01\x02\x01\x00\x02\x01\x00\x30\x0e\x30\x0c\x06\x08\x2b\x06\x01\x02\x01\x01\x01\x00\x05\x00'
expect      = '\xa2'                # GetResponse PDU tag: the community was accepted
on_no_match = "continue"            # try the next community
  [[step.finding]]
  when         = "matched"
  severity     = "high"
  summary      = "SNMP answered the default community 'public'"
  references   = [{ cwe = 1392 }]   # Use of Default Credentials
  excerpt_from = "$response"        # the GetResponse the agent returned

[[step]]                            # community: private
send        = '\x30\x2a\x02\x01\x01\x04\x07private\xa0\x1c\x02\x04\x00\x00\x00\x02\x02\x01\x00\x02\x01\x00\x30\x0e\x30\x0c\x06\x08\x2b\x06\x01\x02\x01\x01\x01\x00\x05\x00'
expect      = '\xa2'
on_no_match = "continue"
  [[step.finding]]
  when         = "matched"
  severity     = "high"
  summary      = "SNMP answered the default community 'private'"
  references   = [{ cwe = 1392 }]
  excerpt_from = "$response"

[[step]]                            # community: manager
send        = '\x30\x2a\x02\x01\x01\x04\x07manager\xa0\x1c\x02\x04\x00\x00\x00\x03\x02\x01\x00\x02\x01\x00\x30\x0e\x30\x0c\x06\x08\x2b\x06\x01\x02\x01\x01\x01\x00\x05\x00'
expect      = '\xa2'
on_no_match = "continue"
  [[step.finding]]
  when         = "matched"
  severity     = "high"
  summary      = "SNMP answered the default community 'manager'"
  references   = [{ cwe = 1392 }]
  excerpt_from = "$response"

[[step]]                            # community: admin
send        = '\x30\x28\x02\x01\x01\x04\x05admin\xa0\x1c\x02\x04\x00\x00\x00\x04\x02\x01\x00\x02\x01\x00\x30\x0e\x30\x0c\x06\x08\x2b\x06\x01\x02\x01\x01\x01\x00\x05\x00'
expect      = '\xa2'
on_no_match = "continue"
  [[step.finding]]
  when         = "matched"
  severity     = "high"
  summary      = "SNMP answered the default community 'admin'"
  references   = [{ cwe = 1392 }]
  excerpt_from = "$response"
