[service]
name = "mssql"
default_ports = [1433]
description = "Microsoft SQL Server"

# TDS Pre-Login packet
[[probe]]
name = "tds_prelogin"
payload = '\x12\x01\x00\x34\x00\x00\x00\x00\x00\x00\x15\x00\x06\x01\x00\x1b\x00\x01\x02\x00\x1c\x00\x0c\x03\x00\x28\x00\x04\x04\x00\x2c\x00\x01\xff\x08\x00\x01\x55\x00\x00\x00\x4d\x53\x53\x51\x4c\x53\x45\x52\x56\x45\x52\x00'
protocol = "tcp"

[[match]]
name = "mssql_prelogin_response"
pattern = '^[\x04\x12][\x01\x00]'
product = "mssql"

# ── The version the pre-login answer states ──────────────────────────────────
#
# The server's pre-login response carries a VERSION option, the product's own
# major, minor and build (MS-TDS, PRELOGIN), rendered by `framed::tds_version`
# as `Microsoft SQL Server 15.0.2000`. The major version is the release.

[[match]]
name = "mssql_2012"
pattern = '^Microsoft SQL Server (11\.\d+\.\d+)$'
version_group = 1
vendor = "Microsoft"
product = "SQL Server"
context = "tds.prelogin_version"
example = "Microsoft SQL Server 11.0.2011"
metadata = { "service.extrainfo" = "SQL Server 2012" }

[[match]]
name = "mssql_2014"
pattern = '^Microsoft SQL Server (12\.\d+\.\d+)$'
version_group = 1
vendor = "Microsoft"
product = "SQL Server"
context = "tds.prelogin_version"
example = "Microsoft SQL Server 12.0.2012"
metadata = { "service.extrainfo" = "SQL Server 2014" }

[[match]]
name = "mssql_2016"
pattern = '^Microsoft SQL Server (13\.\d+\.\d+)$'
version_group = 1
vendor = "Microsoft"
product = "SQL Server"
context = "tds.prelogin_version"
example = "Microsoft SQL Server 13.0.2013"
metadata = { "service.extrainfo" = "SQL Server 2016" }

[[match]]
name = "mssql_2017"
pattern = '^Microsoft SQL Server (14\.\d+\.\d+)$'
version_group = 1
vendor = "Microsoft"
product = "SQL Server"
context = "tds.prelogin_version"
example = "Microsoft SQL Server 14.0.2014"
metadata = { "service.extrainfo" = "SQL Server 2017" }

[[match]]
name = "mssql_2019"
pattern = '^Microsoft SQL Server (15\.\d+\.\d+)$'
version_group = 1
vendor = "Microsoft"
product = "SQL Server"
context = "tds.prelogin_version"
example = "Microsoft SQL Server 15.0.2015"
metadata = { "service.extrainfo" = "SQL Server 2019" }

[[match]]
name = "mssql_2022"
pattern = '^Microsoft SQL Server (16\.\d+\.\d+)$'
version_group = 1
vendor = "Microsoft"
product = "SQL Server"
context = "tds.prelogin_version"
example = "Microsoft SQL Server 16.0.2016"
metadata = { "service.extrainfo" = "SQL Server 2022" }

[[match]]
name = "mssql_version"
pattern = '^Microsoft SQL Server (\d+\.\d+\.\d+)$'
version_group = 1
vendor = "Microsoft"
product = "SQL Server"
context = "tds.prelogin_version"
example = "Microsoft SQL Server 17.0.1000"
