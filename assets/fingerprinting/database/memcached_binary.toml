[service]
name = "memcached_binary"
default_ports = []
# The same daemon and port as memcached.toml, in the binary protocol.
shared_ports  = [11211]
description = "Memcached Binary Protocol"

[[probe]]
name = "version"
payload = '\x80\x0a\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00'
protocol = "tcp"

[[match]]
name = "version_response"
pattern = '^\x81\x0a'
product = "memcached_binary"
# The response magic, then the opcode the request carried back.
example = "\u0081\u000a\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000"
