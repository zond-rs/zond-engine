[service]
name = "aerospike"
# 3000 is shared with Grafana and every development server ever started.
default_ports = [3001, 3002]
shared_ports  = [3000]
description = "Aerospike Database"

[[probe]]
name = "info_statistics"
payload = '\x02\x01\x00\x00\x00\x00\x00\x00\x0astatistics'
protocol = "tcp"

[[match]]
name = "aerospike_response"
pattern = '^\x02\x02'
product = "aerospike"
