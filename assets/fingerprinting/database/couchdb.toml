[service]
name = "couchdb"
default_ports = [5984]
description = "Apache CouchDB"
speaks = "http"

[[probe]]
name = "http_get"
payload = 'GET / HTTP/1.1\r\nHost: localhost\r\n\r\n'
protocol = "tcp"

[[match]]
name = "couchdb_json"
# The welcome document names the product and carries the version. Capturing the
# version raises this to a strong match, the equal of the generic http signature
# that reads the same version from the Server header, so the port is named
# couchdb rather than http with a CouchDB product.
pattern = 'couchdb"\s*:\s*"Welcome"[\s\S]*?"version"\s*:\s*"([^"]+)"'
version_group = 1
product = "CouchDB"
