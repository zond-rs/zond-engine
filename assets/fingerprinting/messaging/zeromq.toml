[service]
name = "zeromq"
# 5555 is Android Debug Bridge more often than it is ZeroMQ.
default_ports = [5556, 5557]
shared_ports  = [5555]
description = "ZeroMQ / ZMTP"

[[probe]]
name = "zmtp_greeting"
payload = '\xff\x00\x00\x00\x00\x00\x00\x00\x01\x7f'
protocol = "tcp"

[[match]]
name = "zmtp_response"
pattern = '^\xff[\x00-\x0a]'
product = "zeromq"
