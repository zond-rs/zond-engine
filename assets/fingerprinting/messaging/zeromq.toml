[service]
name = "zeromq"
# 5555 is Android Debug Bridge more often than it is ZeroMQ.
default_ports = [5556, 5557]
shared_ports  = [5555]
description = "ZeroMQ / ZMTP"

[[probe]]
name = "zmtp_greeting"
payload = '\xff\x00\x00\x00\x00\x00\x00\x00\x01\x7f'
protocol = "tcp"

[[match]]
name = "zmtp_response"
# The ZMTP signature whole, as RFC 23 and its successors fix it: 0xFF, eight
# bytes of padding, then 0x7F. The first two bytes alone are also how a
# Minecraft server list answer begins.
pattern = '(?s)^\xff.{8}\x7f'
product = "zeromq"
example = "\u00ff\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0001\u007f\u0003\u0000NULL"
