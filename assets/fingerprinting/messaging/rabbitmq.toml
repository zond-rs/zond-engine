[service]
name = "rabbitmq"
default_ports = [5672, 5671, 15672]
description = "RabbitMQ / AMQP"

[[probe]]
name = "amqp_header"
payload = 'AMQP\x00\x00\x09\x01'
protocol = "tcp"

[[match]]
name = "amqp_response"
pattern = '^AMQP\x00'
product = "rabbitmq"

# The management plugin on 15672. It answers the generic request with its own
# page title behind a generic Cowboy banner, so the title is what names it.
[[match]]
name = "rabbitmq_management_title"
pattern = '^RabbitMQ Management$'
vendor = "vmware"
product = "rabbitmq"
context = "html_title"
example = "RabbitMQ Management"
