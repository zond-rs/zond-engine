[service]
name = "mqtt"
default_ports = [1883, 8883]
description = "MQTT Message Queuing Telemetry Transport"

# MQTT Connect packet
[[probe]]
name = "mqtt_connect"
payload = '\x10\x0c\x00\x04\x4d\x51\x54\x54\x04\x02\x00\x3c\x00\x00'
protocol = "tcp"

[[match]]
name = "mqtt_connack"
# MQTT 3.1.1 §3.2, the CONNACK whole: the packet type, a remaining length of
# two, the acknowledge flags (only session-present may be set), and a return
# code from 0 to 5. A broker says nothing more until the client does, so the
# four bytes are the reply; a Modbus reply whose transaction ID is 0x2002
# opens with the first three of them.
pattern = '^\x20\x02[\x00\x01][\x00-\x05]$'
product = "mqtt"
example = "\u0020\u0002\u0000\u0000"
