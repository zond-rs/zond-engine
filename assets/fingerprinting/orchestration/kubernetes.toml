[service]
name = "kubernetes"
default_ports = [6443, 10250]
# 8443 is the generic TLS-HTTP alternate long before it is an API server.
shared_ports  = [8443]
description = "Kubernetes API Server"
speaks = "http"

[[probe]]
name = "get_api"
payload = 'GET /api HTTP/1.1\r\nHost: localhost\r\n\r\n'
protocol = "tcp"

[[match]]
name = "k8s_response"
pattern = 'Kubernetes'
product = "kubernetes"
