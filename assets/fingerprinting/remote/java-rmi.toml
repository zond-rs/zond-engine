[service]
name = "java-rmi"
default_ports = [1099]
description = "Java RMI registry"

# The JRMP handshake: "JRMI", protocol version 2, stream protocol 0x4b. A
# registry answers 0x4e followed by the host it believes it is.
[[probe]]
name = "jrmp_handshake"
payload = 'JRMI\x00\x02\x4b'
protocol = "tcp"

[[match]]
name = "jrmp_ack"
# The Java RMI specification's transport protocol: ProtocolAck (0x4E), then the
# endpoint the server believes the client reached, written as a Java UTF string
# (two bytes of length, the host) and a four-byte port. A host name fits the
# first length byte at zero, a port the first two bytes of its integer. Alone,
# 0x4E is an ASCII `N`, which is how an IRC server's first `NOTICE` opens.
pattern = '(?s)^\x4e\x00.[\x21-\x7e]+\x00\x00'
product = "java-rmi"
example = "N\u0000\u000c198.51.100.7\u0000\u0000\u0004K"
