[service]
name = "adb"
default_ports = [5555]
description = "Android Debug Bridge"

# CNXN, version 1.0.0, max payload 4096, then the host banner. A device answers
# CNXN with its own banner, or AUTH when it wants a key first.
# Unverified against a real device.
[[probe]]
name = "adb_connect"
payload = 'CNXN\x00\x00\x00\x01\x00\x10\x00\x00\x07\x00\x00\x00\x32\x02\x00\x00\xbc\xb1\xa7\xb1host::\x00'
protocol = "tcp"

[[match]]
name = "adb_connect_reply"
pattern = '^(CNXN|AUTH)'
product = "adb"
