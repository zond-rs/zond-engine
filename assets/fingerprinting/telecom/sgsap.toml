# Name only, deliberately. This service is carried over SCTP, where identifying
# what is behind a port needs a completed association and this engine opens
# none. Naming the number is still worth doing: it is what a scan prints beside
# the port it found.

[service]
name = "sgsap"
default_ports = [29118]
description = "SGs Application Protocol, between MME and MSC for circuit-switched fallback, 3GPP TS 29.118"
