# macOS, iOS and iPadOS — the Darwin family.
#
# Written from documented Darwin defaults and then **confirmed against hardware**
# — a Mac answering on port 22, with every predicted field holding — so the rule
# is `measured` and scores as such. The values below are the ones observed, not
# the ones expected.
#
# Darwin's TCP is BSD-derived and writes its SYN+ACK options in an order nothing
# else uses: maximum segment size, no-op, window scale, two no-ops, timestamp,
# SACK-permitted, end-of-list. The trailing end-of-list marker is the part worth
# noticing — most stacks simply stop, and a layout ending in `E` is close to a
# signature by itself.
#
# The initial hop counter is 64, shared with Linux, so it separates nothing on
# its own here; the layout is what distinguishes the two, and it differs in every
# position.
#
# One rule for the whole family on purpose. macOS and iOS run the same kernel and
# the same TCP, so a reply cannot tell a Mac from an iPhone — and a rule claiming
# otherwise would be inventing a distinction the evidence does not carry.
# Separating them needs something else entirely: a service banner, a name over
# multicast DNS, or the hardware address.
#
# Measured on a real segment: six labelled Apple devices answered resets only,
# because a phone or tablet has nothing listening. This rule needs an open port,
# which in practice means a Mac with Remote Login, screen sharing or file sharing
# turned on.
provenance = "measured"
notes = "Confirmed on a Mac with Remote Login enabled, 2026-08-18: every predicted field held. Covers iOS and iPadOS, which share the kernel and are indistinguishable at this layer — that part remains inference from the shared kernel rather than observation."

[os]
family = "macOS"
vendor = "Apple"

[match]
reply = "syn_ack"
initial_hops = { equals = 64 }
option_layout = { equals = "M,N,W,N,N,T,S,E" }
timestamps = { equals = true }
sack_permitted = { equals = true }

# A range rather than the 6 that was measured. One Mac is one Mac, and a scale
# is a release-time default that moves; pinning it would over-fit this rule to
# the machine that happened to confirm it. What identifies this family is the
# option order, which is unlike anything else in the corpus in every position —
# the scale only has to be plausible.
window_scale = { range = [4, 8] }

# The raw window, not a multiple of the segment size, because this stack picks a
# number rather than a multiple. 65535 is the largest the field holds, and it is
# what was measured regardless of the path — so the derived figures (`45 x 1448 +
# 375` at this MSS, `48 x 1348 + 831` at another) describe the path rather than
# the sender, and a rule keyed on them would match one network and not the next.
window = { equals = 65535 }

[[example]]
source = "a Mac with Remote Login enabled, answering on port 22; measured on a LAN 2026-08-18"
reply = "syn_ack"
remaining_hops = 64
dont_fragment = true
option_layout = "M,N,W,N,N,T,S,E"
window = 65535
mss = 1460
window_scale = 6
timestamps = true
sack_permitted = true
