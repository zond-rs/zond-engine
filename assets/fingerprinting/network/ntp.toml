[service]
name = "ntp"
default_ports = [123]
description = "Network Time Protocol"

# An SNTP client request (RFC 4330). Every field may be zero except the first
# byte, which carries the leap indicator, version and mode; a server replies
# with its own timestamps, so a 48-byte packet of zeros is enough to prove the
# port is open.
#
#   23           LI = 0 (no warning), VN = 4, Mode = 3 (client)
#   00 x47       stratum, poll, precision, root delay/dispersion, reference ID,
#                and the four timestamps - all optional in a client request
[[probe]]
name = "ntp_client_request"
payload = '\x23\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00'
protocol = "udp"

# A mode 6 control message, asking the daemon to read out its system variables.
# The client request above proves the port is open and carries nothing to read;
# this asks the question the corpus was already written for.
#
#   16     leap 0, version 2, mode 6 (control)
#   02     not a response, no error, no more fragments, opcode 2 (read variables)
#   0001   sequence
#   0000   status
#   0000   association id 0, meaning the daemon itself rather than a peer
#   0000   offset
#   0018   twenty-four bytes of data follow
#   ...    "version,processor,system"
#
# The variables are named rather than left to the daemon. A request naming none
# gets whichever set the daemon considers its default, and the two families
# disagree about that: classic ntpd answers with `version` first, which is what
# the imported rules were written against, while ntpsec answers with `leap`,
# `stratum` and the rest of the status block, which identifies nothing. Asking
# for the three by name gets them from both.
#
# The order here is the order the imported rules read them in. ntpsec sorts its
# reply alphabetically regardless, which costs those rules the version and not
# the operating system; `ntpsec_version` below is what covers that.
#
# Many builds refuse this outright. `noquery` in the default `restrict` line has
# been standard advice for years, and ntpsec goes further, answering a control
# query only from an address a `restrict` line names. A daemon configured either
# way says nothing, and the probe costs one datagram.
[[probe]]
name = "ntp_control_readvar"
payload = '\x16\x02\x00\x01\x00\x00\x00\x00\x00\x00\x00\x18version,processor,system'
protocol = "udp"

# ── The daemon named wherever it puts its own version ────────────────────────

[[match]]
name = "ntpsec_version"
# ntpsec sorts its reply alphabetically, so `version=` arrives last and the
# imported rules, which read it first and reach the rest with `.*`, take the
# operating system and leave the version behind. This reads it wherever it sits.
pattern = '(?i)version="ntpd ntpsec-([\d.]+)'
version_group = 1
vendor = "NTPsec"
product = "NTPsec"
context = "ntp.readvar"
example = 'processor="aarch64", system="Linux/6.1.0-50-cloud-arm64", version="ntpd ntpsec-1.2.2"'
metadata = { "service.cpe23" = "cpe:/a:ntpsec:ntpsec:{service.version}" }
