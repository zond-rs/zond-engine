[service]
name = "dns"
default_ports = [53]
description = "Domain Name System"

# A DNS query for `version.bind` in the CHAOS class: the conventional "who are
# you" question, which a nameserver answers from its own configuration. A server
# that hides its version still answers - with REFUSED, or an empty response -
# and for a port scan any answer at all is the result.
#
# Chosen over a normal lookup for two reasons. It draws a ~58-byte reply, where
# a root-NS query returns ~500 bytes to a 17-byte question and would make the
# scanner an amplifier pointed at a third party. And it costs the server
# nothing: a recursive query would send it out to the internet on our behalf,
# once per probe.
#
#   00 00        transaction ID
#   01 00        flags: standard query, recursion desired
#   00 01        QDCOUNT: one question
#   00 00 x3     ANCOUNT / NSCOUNT / ARCOUNT
#   07 version   QNAME, length-prefixed labels
#   04 bind
#   00           end of name
#   00 10        QTYPE: TXT
#   00 03        QCLASS: CH (CHAOS)
[[probe]]
name = "dns_version_bind"
payload = '\x00\x00\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00\x07version\x04bind\x00\x00\x10\x00\x03'
protocol = "udp"

# The same question over TCP, which RFC 1035 §4.2.2 frames with a two-byte
# big-endian length: `\x00\x1e` for the thirty bytes that follow.
#
# Authored because a nameserver on TCP/53 is otherwise one of the few ports that
# answers nothing an engine can read — it waits for a length prefix, reads a
# generic HTTP request as a claim of eighteen thousand bytes, and never speaks
# again. That silence used to cost two seconds and produce no service name at
# all, on a port every resolver in the world listens on.
[[probe]]
name = "dns_version_bind_tcp"
payload = '\x00\x1e\x00\x00\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00\x07version\x04bind\x00\x00\x10\x00\x03'
protocol = "tcp"

[[match]]
name = "dns_tcp_match"
pattern = '^[\x00-\xff][\x00-\xff][\x01\x00]' # Basic DNS header response part
product = "dns"
