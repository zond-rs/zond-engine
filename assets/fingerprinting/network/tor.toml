[service]
name = "tor"
default_ports = [9050, 9001]
description = "Tor Onion Router"

[[probe]]
name = "socks5_handshake"
payload = '\x05\x01\x00'
protocol = "tcp"

[[match]]
name = "tor_socks_match"
# RFC 1928 §3, as for any SOCKS5 proxy: version 5 and no authentication, the
# two bytes being the whole reply. A DCE/RPC reply opens with the same two.
pattern = '^\x05\x00$'
product = "tor_socks"
example = "\u0005\u0000"
