[service]
name = "ldap"
# 3268 and 3269 are the Active Directory global catalog.
default_ports = [389, 636, 3268, 3269]
description = "Lightweight Directory Access Protocol"

# LDAP Bind Request (anonymous simple bind)
[[probe]]
name = "ldap_bind_request"
payload = '\x30\x0c\x02\x01\x01\x60\x07\x02\x01\x03\x04\x00\x80\x00'
protocol = "tcp"

# The root DSE, which is what names the directory. An anonymous bind establishes
# that something speaks LDAP and nothing more; the entry at the empty DN carries
# `vendorName`, `namingContexts` and the functionality levels that separate
# Active Directory from OpenLDAP from a Samba domain controller.
#
# RFC 4512 §5.1 makes it readable without credentials, and asking for `*` and `+`
# is what returns the operational attributes the corpus reads. The rules match
# the response bytes as text rather than a parse of them, so nothing here decodes
# BER.
#
#   30 2b                   SEQUENCE, 43 bytes: the message
#     02 01 02              INTEGER message ID = 2
#     63 26                 SearchRequest, 38 bytes
#       04 00               baseObject = "", the root DSE
#       0a 01 00            scope = baseObject
#       0a 01 00            derefAliases = neverDerefAliases
#       02 01 00            sizeLimit = 0
#       02 01 00            timeLimit = 0
#       01 01 00            typesOnly = FALSE
#       87 0b "objectClass" filter = present, context tag 7
#       30 06               attributes: `*` then `+`
[[probe]]
name = "ldap_root_dse_search"
payload = '\x30\x2b\x02\x01\x02\x63\x26\x04\x00\x0a\x01\x00\x0a\x01\x00\x02\x01\x00\x02\x01\x00\x01\x01\x00\x87\x0bobjectClass\x30\x06\x04\x01\x2a\x04\x01\x2b'
protocol = "tcp"

[[match]]
name = "ldap_response"
# RFC 4511 §4.1.1: an LDAPMessage is a SEQUENCE whose first element is the
# message ID, an INTEGER. Requiring that header as well as the sequence tag is
# what keeps this off ordinary text: `\x30` is the character `0` and a short
# length spans nearly all printable ASCII, so the tag and a length alone match
# any text beginning with a zero. `\x02\x01` is STX then SOH, which text does
# not carry.
#
# The length comes in every form BER allows a message to take (X.690 §8.1.3):
# one byte below 0x80, or 0x81, 0x82 or 0x84 and that many bytes behind it.
# Active Directory writes every length in the four-byte form, so a rule that
# took the length for one byte never read a domain controller.
pattern = '(?s)^\x30(?:[\x0c-\x7f]|\x81.|\x82..|\x84....)\x02\x01'
product = "ldap"
# A bind response from Active Directory: success, no DN, no message.
example = "0\u0084\u0000\u0000\u0000\u0010\u0002\u0001\u0001a\u0084\u0000\u0000\u0000\u0007\u000a\u0001\u0000\u0004\u0000\u0004\u0000"
