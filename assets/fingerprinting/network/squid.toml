[service]
name = "squid"
default_ports = [3128]
# 8080 is shared with every other HTTP server.
shared_ports  = [8080]
description = "Squid HTTP Proxy"
speaks = "http"

# No probe. Squid answers the generic `GET /` with its own `Server:` line, and a
# proxy-form probe would make the proxy fetch the URL and be fingerprinted as it.

[[match]]
name = "squid_server_header"
pattern = '(?i)Server:\s*squid/([\d.]+)'
version_group = 1
vendor = "squid-cache"
product = "squid"
example = "Server: squid/6.13"
metadata = { "service.cpe23" = "cpe:/a:squid-cache:squid:{service.version}" }

[[match]]
name = "squid_error_header"
pattern = '(?i)X-Squid-Error'
product = "squid"
