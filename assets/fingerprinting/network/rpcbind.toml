[service]
name = "rpcbind"
default_ports = [111]
description = "SUN Remote Procedure Call (Portmapper)"

# A PMAPPROC_DUMP call: ask the portmapper for everything it has registered.
# There are no arguments, so the whole call is the header.
#
#   7a6f6e64     transaction id
#   00000000     message type 0, a call
#   00000002     RPC version 2
#   000186a0     program 100000, the portmapper
#   00000002     program version 2
#   00000004     procedure 4, DUMP
#   00000000 x4  a null credential and a null verifier
#
# The reply is the interesting part. It names every program the host runs, its
# version, and the port it is on, which for `nfs` and `mountd` is very often not
# the registered number.
[[probe]]
name = "rpcbind_dump"
payload = 'zond\x00\x00\x00\x00\x00\x00\x00\x02\x00\x01\x86\xa0\x00\x00\x00\x02\x00\x00\x00\x04\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00'
protocol = "udp"

# The same call over TCP, where RFC 5531 §11 puts a record mark in front of
# it: the top bit says this fragment is the last, and the rest is its length,
# forty bytes.
[[probe]]
name = "rpcbind_dump_tcp"
payload = '\x80\x00\x00\x28zond\x00\x00\x00\x00\x00\x00\x00\x02\x00\x01\x86\xa0\x00\x00\x00\x02\x00\x00\x00\x04\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00'
protocol = "tcp"

[[match]]
name = "rpc_tcp_fragment"
# A record mark for a last fragment, then the transaction id the call carried
# and message type 1, a reply. Two or three characters for the three length
# bytes, because two of them that happen to form a UTF-8 sequence read as one.
# A high first byte alone is how a dozen binary protocols begin, and this rule
# is matched on every port nothing else names.
pattern = '(?s)^\x80.{2,3}zond\x00\x00\x00\x01'
product = "rpcbind"
example = "\u0080\u0000\u0000\u001czond\u0000\u0000\u0000\u0001\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000\u0000"

# ── What the portmapper says it has ──────────────────────────────────────────
#
# The dump is rendered as `name version transport port`, comma separated. Rules
# anchor on a program name at a record boundary, which is the start of the text
# or just after a comma.

[[match]]
name = "rpcbind_registrations"
# The baseline: a dump this file has no more specific rule for. It names no
# product, so a rule that names one outranks it rather than tying with it and
# winning on declaration order. `rpcbind` would have been that product, and it
# is what the port is already called, so nothing is lost by leaving it out.
pattern = '(?i)^(?:portmapper|nfs|mountd|nlockmgr|status|nfs_acl|rquotad|rusersd|\d+) \d+ (?:tcp|udp) \d+'
context = "rpc.program_dump"
example = "portmapper 2 udp 111, nfs 3 tcp 2049, mountd 3 udp 20048"

[[match]]
name = "rpc_nfs_registered"
# A host registering both is a file server, and the pair is what says so: `nfs`
# alone is registered by a client's own callback service on some systems.
#
# Two lookaheads rather than one expression, because the order is the
# portmapper's to choose and not this rule's to assume. An earlier version read
# `nfs ... mountd` in sequence and never fired on a real Linux server, which
# lists every mountd version before the first nfs one.
#
# The space after each program name is what separates `nfs` from `nfs_acl`: the
# latter is registered beside it on the same port and is not the file service.
#
# No version. The dump lists one record per version per transport, so a capture
# here would name whichever the server happened to write first. The probe on
# 2049 answers that question properly, with the range.
pattern = '(?i)^(?=.*\bmountd \d+ (?:tcp|udp) )(?=.*\bnfs \d+ (?:tcp|udp) )'
product = "NFS"
context = "rpc.program_dump"
example = "portmapper 2 udp 111, mountd 3 udp 20048, nfs 3 tcp 2049"
metadata = { "service.extrainfo" = "exported over RPC" }
