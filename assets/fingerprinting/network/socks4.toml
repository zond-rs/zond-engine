[service]
name = "socks4"
default_ports = []
# 1080 is both dialects' port. SOCKS5 is what is deployed, so socks5.toml names it.
shared_ports  = [1080]
description = "SOCKS4 Proxy"

[[probe]]
name = "handshake"
payload = '\x04\x01\x00\x50\x7f\x00\x00\x01\x00'
protocol = "tcp"

[[match]]
name = "socks4_response"
# The SOCKS 4 protocol's reply whole: a version of zero, a result from 90
# (granted) to 93, then two bytes of port and four of address, eight bytes in
# all. Those six are arbitrary, and a reading of the reply as text may join
# them into as few as two characters. `\x00\x5a` alone is how a DNS reply over
# TCP of ninety bytes opens.
pattern = '(?s)^\x00[\x5a-\x5d].{2,6}$'
product = "socks4"
example = "\u0000\u005a\u0000\u0050\u007f\u0000\u0000\u0001"
