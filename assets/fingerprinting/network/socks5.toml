[service]
name = "socks5"
default_ports = [1080]
description = "SOCKS5 Proxy"

[[probe]]
name = "handshake"
payload = '\x05\x01\x00'
protocol = "tcp"

[[match]]
name = "socks5_response"
pattern = '^\x05[\x00\xff]'
product = "socks5"
# RFC 1928 §3: version 5, then the method chosen, 0xFF where none was
# acceptable, which is how a proxy that wants a password refuses anonymity.
example = "\u0005\u00ff"
