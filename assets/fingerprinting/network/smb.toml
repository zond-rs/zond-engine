[service]
name = "smb"
default_ports = [445]
description = "Microsoft-DS / SMB"

# An SMB1 negotiate that offers the SMB2 dialects beside NT LM 0.12, the
# question every SMB server answers. MS-SMB2 has a server that speaks SMB2
# answer it in SMB2, which Windows and Samba still do with SMB1 turned
# off; a server from before SMB2 answers in SMB1, choosing NT LM 0.12.
#
#   00 00 00 45           NetBIOS length
#   ff 53 4d 42 72 ...    SMB_COM_NEGOTIATE, extended security, Unicode
#   00 22 00              no words, 34 bytes of dialects:
#   02 "NT LM 0.12" 00
#   02 "SMB 2.002" 00
#   02 "SMB 2.???" 00
#
# A negotiate in SMB1 alone is dropped by everything current, and one in SMB2
# alone by everything older, so this is the one question that is answered by
# both. What to ask next depends on which protocol the answer is in, and a
# connection that has negotiated one will not carry the other, so the rest of
# the conversation is the SMB analyzer's, on connections of its own: the
# dialect, the signing policy and the Windows build over SMB2, and the
# operating system and LAN manager over SMB1 where SMB2 named no build.
[[probe]]
name = "smb_multi_protocol_negotiate"
payload = '\x00\x00\x00\x45\xffSMBr\x00\x00\x00\x00\x18\x01\xc8\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\xff\xfe\x00\x00\x01\x00\x00\x22\x00\x02NT LM 0.12\x00\x02SMB 2.002\x00\x02SMB 2.???\x00'
protocol = "tcp"

[[match]]
name = "smb_header_match"
# A NetBIOS session message whose body is SMB1 (0xFF) or SMB2 (0xFE).
pattern = '(?s)^\x00\x00\x00..SMB'
product = "smb"
example = "\u0000\u0000\u0000AþSMB@\u0000"

# ── What an SMB2 server says before anything is authenticated ────────────────

[[match]]
name = "smb2_negotiated"
# The dialect chosen from the ones offered, and whether the server requires
# every session to be signed. One that does not is one whose sessions can be
# relayed to it from a captured authentication.
pattern = '^dialect ([23]\.\d+(?:\.\d+)?); signing (required|not required)$'
context = "smb2.negotiate"
example = "dialect 3.1.1; signing not required"
metadata = { "service.extrainfo" = "SMB {capture:1}, signing {capture:2}" }

# The version an NTLM challenge carries is the Windows kernel's own: major,
# minor and build. Most builds are shared by a client and a server release,
# 14393 by Windows 10 1607 and Server 2016, 17763 by 1809 and Server 2019,
# 26100 by Windows 11 24H2 and Server 2025, so a build names the family and the
# kernel and a release only where it belongs to one.
[[match]]
name = "ntlm_windows_build"
pattern = '^Windows (\d+\.\d+) Build (\d+)$'
context = "ntlm.os_version"
example = "Windows 10.0 Build 17763"
metadata = { "os.vendor" = "Microsoft", "os.family" = "Windows", "os.kernel" = "{capture:1}.{capture:2}" }

[[match]]
name = "ntlm_windows_server_2022"
pattern = '^Windows 10\.0 Build (20348)$'
context = "ntlm.os_version"
example = "Windows 10.0 Build 20348"
metadata = { "os.vendor" = "Microsoft", "os.family" = "Windows", "os.product" = "Windows Server 2022", "os.kernel" = "10.0.{capture:1}", "os.cpe23" = "cpe:/o:microsoft:windows_server_2022:-" }

# 22000 is 21H2, 22621 is 22H2 and 22631 is 23H2, none of which shipped as a
# server.
[[match]]
name = "ntlm_windows_11"
pattern = '^Windows 10\.0 Build (22000|22621|22631)$'
context = "ntlm.os_version"
example = "Windows 10.0 Build 22631"
metadata = { "os.vendor" = "Microsoft", "os.family" = "Windows", "os.product" = "Windows 11", "os.kernel" = "10.0.{capture:1}", "os.cpe23" = "cpe:/o:microsoft:windows_11:-" }
