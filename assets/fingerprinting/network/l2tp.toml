[service]
name = "l2tp"
default_ports = [1701]
description = "Layer 2 Tunneling Protocol"

# An SCCRQ, which is how a peer proposes a tunnel. A concentrator answers with
# an SCCRP naming itself, and no session is established: the exchange is
# abandoned after the first reply, which is all a scan needs.
#
#   c802        control message, length and sequence present, version 2
#   003d        length
#   0000 0000   tunnel and session id, zero until the peer assigns them
#   0000 0000   Ns and Nr
#   then the attributes a concentrator expects before it will answer:
#     0  Message Type = 1 (SCCRQ)
#     2  Protocol Version 1.0
#     3  Framing Capabilities
#     7  Host Name
#     9  Assigned Tunnel ID
[[probe]]
name = "l2tp_sccrq"
payload = '\xc8\x02\x00\x3d\x00\x00\x00\x00\x00\x00\x00\x00\x80\x08\x00\x00\x00\x00\x00\x01\x80\x08\x00\x00\x00\x02\x01\x00\x80\x0a\x00\x00\x00\x03\x00\x00\x00\x03\x80\x0f\x00\x00\x00\x07zond-scan\x80\x08\x00\x00\x00\x09zo'
protocol = "udp"

# The same request under a different tunnel id, because L2TP remembers.
#
# A concentrator that has already seen a tunnel request answers a repeat of it
# with a zero-length acknowledgement rather than with its own name, and a scan
# sends this probe twice: once to establish the port is open, once to identify
# what is behind it. The second datagram was drawing the acknowledgement and the
# port came back named `l2tp` and nothing else.
#
# So the identification pass has a request of its own to send. Measured against
# xl2tpd 1.3.16: a fresh tunnel id draws a full SCCRP where a repeated one draws
# twelve bytes.
[[probe]]
name = "l2tp_sccrq_second_tunnel"
payload = '\xc8\x02\x00\x3d\x00\x00\x00\x00\x00\x00\x00\x00\x80\x08\x00\x00\x00\x00\x00\x01\x80\x08\x00\x00\x00\x02\x01\x00\x80\x0a\x00\x00\x00\x03\x00\x00\x00\x03\x80\x0f\x00\x00\x00\x07zond-scan\x80\x08\x00\x00\x00\x09Z1'
protocol = "udp"

# ── What the concentrator names ──────────────────────────────────────────────
#
# The vendor name identifies the implementation, and is the whole text when
# the reply names one. The host name is the machine's own and is recorded as
# one of the host's names rather than offered here.

[[match]]
name = "xl2tpd"
# xl2tpd reports the domain of the project that maintains it rather than a
# product name. Measured against xl2tpd 1.3.16 on Debian 12.
pattern = '(?i)^vendor=xelerance\.com\b'
product = "xl2tpd"
context = "l2tp.sccrp"
example = "vendor=xelerance.com"

[[match]]
name = "cisco_l2tp"
pattern = '(?i)^vendor=Cisco\b'
vendor = "Cisco"
product = "Cisco L2TP"
context = "l2tp.sccrp"
example = "vendor=Cisco Systems, Inc."
metadata = { "os.vendor" = "Cisco" }

[[match]]
name = "microsoft_l2tp"
pattern = '(?i)^vendor=Microsoft\b'
vendor = "Microsoft"
product = "Windows RRAS"
context = "l2tp.sccrp"
example = "vendor=Microsoft"
metadata = { "os.vendor" = "Microsoft", "os.family" = "Windows", "os.product" = "Windows" }

[[match]]
name = "l2tp_concentrator"
# The baseline, naming no product so the rules above outrank it.
pattern = '^(?:l2tp$|vendor=)'
context = "l2tp.sccrp"
example = "l2tp"
