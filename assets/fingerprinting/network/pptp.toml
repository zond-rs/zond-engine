[service]
name = "pptp"
default_ports = [1723]
description = "Point-to-Point Tunneling Protocol"

# Start-Control-Connection-Request. The reply states the vendor and firmware,
# which is often the only thing a legacy concentrator will say about itself.
# Unverified against a real daemon: the pptpd images are amd64 only.
[[probe]]
name = "start_control_connection"
payload = '\x00\x9c\x00\x01\x1a\x2b\x3c\x4d\x00\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00\x01\x00\x00\x00\x01\x00\x00\x00\x00\x00\x00\x00\x00zond\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00'
protocol = "tcp"

[[match]]
name = "start_control_connection_reply"
pattern = '^\x00\x9c\x00\x01\x1a\x2b\x3c\x4d\x00\x02'
product = "pptp"
# RFC 2637 §2.2: the reply's length, a control message, the magic cookie, and
# message type 2, then protocol version 1.0 and result code 1, success.
example = "\u0000\u009c\u0000\u0001\u001a+<M\u0000\u0002\u0000\u0000\u0001\u0000\u0001\u0000"
