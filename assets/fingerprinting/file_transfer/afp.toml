[service]
name = "afp"
default_ports = [548]
description = "Apple Filing Protocol"

# DSI GetStatus: request 0x00, command 0x03, then a zeroed header. The reply is a
# server parameters block naming the machine and its AFP versions.
# Unverified against a real daemon: the netatalk images are amd64 only.
[[probe]]
name = "dsi_getstatus"
payload = '\x00\x03\x00\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00\x00'
protocol = "tcp"

[[match]]
name = "dsi_reply"
# The DSI header whole, as Apple's AFP over TCP fixes it: the reply flag, the
# GetStatus command, the request ID the probe sent (1), four bytes of error
# code, four of data length, and four reserved and zero. The first two bytes
# alone are also a Modbus reply's transaction ID.
pattern = '(?s)^\x01\x03\x00\x01.{8}\x00\x00\x00\x00'
product = "afp"
example = "\u0001\u0003\u0000\u0001\u0000\u0000\u0000\u0000\u0000\u0000\u0001\u0000\u0000\u0000\u0000\u0000"
