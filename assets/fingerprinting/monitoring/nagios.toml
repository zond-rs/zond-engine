[service]
name = "nrpe"
default_ports = [5666]
description = "Nagios NRPE"

# A version 2 query as NRPE's common.h lays the packet out, 1036 bytes: the
# packet version (2) and type (1, a query), a CRC-32 over the whole packet
# taken with its own field zeroed, a result code, a 1024-byte buffer holding
# the command, and the two bytes of padding that round the struct to four. The
# command is `_NRPE_CHECK`, which the daemon answers with its version and runs
# nothing for. The daemon reads a whole packet before it answers and drops one
# whose CRC does not check, so neither a short query nor an unsummed one is
# answered.
