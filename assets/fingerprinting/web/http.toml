[service]
name = "http"
default_ports = [
  80, 443, 5000, 8000, 8080, 8123, 8443, 9000,
  # HTTP alternates: nothing else has a comparable claim on any of them.
  4200, 4443, 5173, 7000, 7001, 8008, 8009, 8010, 8081, 8088, 8090,
  8180, 8181, 8888, 9443,
]
# 3000 is left out: a third probe on it pushes the service pass past COLLECTION_BUDGET.
description = "Hypertext Transfer Protocol"

# The probe that will be sent to the target to elicit an HTTP response.
#
# `generic` marks it as worth asking of *any* open port that has no probe of its
# own, not just of the ports listed above. An unrecognised open port is most
# often an HTTP server on a number nobody registered — a media server, an
# exporter, an admin panel, a development build — and one request names it. The
# alternative is what this engine used to do: wait out a banner that never comes,
# then guess at TLS, and report the port with no service at all.
speaks = "http"

# `Host: localhost` is a placeholder: the engine puts the port being asked in its
# place, the name a target gave its address or the address itself.
[[probe]]
name = "get_root"
payload = 'GET / HTTP/1.1\r\nHost: localhost\r\nUser-Agent: ZondScanner/1.0\r\nAccept: */*\r\n\r\n'
protocol = "tcp"
generic = true

# Match rules applied against the HTTP response
[[match]]
name = "generic_http"
pattern = '(?i)^HTTP/\d+\.\d+\s+\d+'
product = "http"

[[match]]
name = "nginx_server_header"
pattern = '(?i)Server:\s*nginx/([\d\.]+)'
version_group = 1
vendor = "NGINX"
product = "nginx"
metadata = { "service.cpe23" = "cpe:/a:f5:nginx:{service.version}" }

[[match]]
name = "apache_server_header"
pattern = '(?i)Server:\s*Apache/([\d\.]+)'
version_group = 1
vendor = "Apache Software Foundation"
product = "Apache HTTP Server"
metadata = { "service.cpe23" = "cpe:/a:apache:http_server:{service.version}" }

[[match]]
name = "lighttpd_server_header"
pattern = '(?i)Server:\s*lighttpd/([\d\.]+)'
version_group = 1
vendor = "lighttpd"
product = "lighttpd"
metadata = { "service.cpe23" = "cpe:/a:lighttpd:lighttpd:{service.version}" }

