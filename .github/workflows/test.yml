# The test suite, on the platforms this crate claims to support.
#
# There is deliberately no build-and-release job here. This repository is a
# library: `cargo build --release` produces an `.rlib` nobody downloads, and the
# zip, tarball and `.deb` this workflow used to publish were for a `zond` binary
# that no target in this repository builds. They belong to the CLI, which is a
# separate repository with its own release.
#
# A library's release is `cargo publish`, and that is deliberately not automated
# here — pushing a version to crates.io is irreversible, and it should be a
# person's decision rather than a side effect of tagging. What this workflow does
# instead is check, on every change, that the crate *could* be published: see the
# packaging job.
#
# Windows is not in the matrix, and the reason has narrowed rather than gone
# away. It was "the crate says it is unsupported and it is; a runner for it would
# be permanently red and would teach everyone to ignore a failing job, which is
# worse than not having one." As of 2026-08-27 the crate compiles, lints and
# links for Windows, and `windows.yml` holds that ground on every change.
#
# What still cannot run is the suite, and the reason is upstream: `pnet_datalink`
# reports no interface flags on Windows, so every entry point finds an empty
# network and says so without erroring. Until that is fixed the tests here would
# pass by asserting nothing, which is the failure the paragraph above was written
# against. This matrix gains Windows when the Windows workflow reaches its Tier 2
# (it runs the suite, and the interface layer no longer lies), and not before.
name: Test

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "assets/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "assets/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test.yml"

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      # `--all-features` rather than a bare `cargo test`: the export and import
      # formats are each behind a feature, and a suite that only ever runs the
      # default set leaves most of them compiled but never executed.
      - name: Run tests
        run: cargo test --all-features

      # Tier 2 marks work the engine does not do yet with `#[ignore]`. Those are
      # claims, not switched-off tests: each one runs, fails for the reason it
      # states, and removing the attribute is the definition of done. This step
      # confirms they still fail for that reason, and does not gate the build.
      - name: Check the ignored tests still fail as claimed
        continue-on-error: true
        run: cargo test --all-features -- --ignored

  # Tier 3, which `tests/README.md` describes and until now nothing ran: the
  # tests that need a real kernel, and the one that needs a document this project
  # did not write.
  #
  # The step above runs the same tests without gating, on a runner where none of
  # them can pass, so it reports a known failure rather than checking anything.
  # This job is where they are actually cashed, and it gates.
  #
  # **The nmap document is generated rather than committed**, which is the whole
  # point of the test that reads it. Every other nmap test in this crate parses a
  # document typed into the source file by somebody with beliefs about nmap's
  # output, and that is the trap the project keeps finding. A committed fixture
  # would be the same trap with a longer shelf life. So nmap writes one here, on
  # every run, against this runner's own loopback.
  privileged:
    name: Privileged tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libpcap and nmap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev nmap

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      # Against this runner's own loopback, so the scan leaves the machine
      # nowhere. What is listening does not matter: the test reads the document's
      # shape, and nmap writes a well-formed one either way.
      - name: Have nmap write a document
        run: nmap -oX "$RUNNER_TEMP/real.xml" -sV -p 22,80,443 127.0.0.1

      # Built unprivileged, so the cache and the target directory stay owned by
      # the runner user. Only the run below needs root.
      - name: Build the test binaries
        run: cargo test --all-features --no-run

      - name: Run the tests that need a kernel and a real document
        run: |
          sudo -E env "PATH=$PATH" ZOND_NMAP_XML="$RUNNER_TEMP/real.xml" \
            cargo test --all-features -- --ignored

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned to the exact version `Cargo.toml` declares. Without this the
      # `rust-version` field is an assertion nobody checks, and the README badge
      # advertising it is a promise to strangers made on no evidence.
      - name: Install the declared minimum toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      # Build rather than test: the question is whether a consumer on this
      # toolchain can compile the crate and everything it exposes. The dev
      # dependencies are the test suite's problem, not theirs.
      - name: Build on the declared minimum
        run: cargo build --all-features

  package:
    name: Publishable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      # Builds the crate from the packaged files rather than from the working
      # tree, which is the only thing that catches a file the package needs and
      # does not carry. `build.rs` compiles the fingerprint signatures out of
      # `assets/`, so an `exclude` that swept those up would produce a crate that
      # fails to build for every consumer and for nobody here.
      #
      # It does not publish. It answers "could this be published", which is a
      # question worth having answered before the day somebody wants to.
      - name: Verify the crate packages and builds from the package
        run: cargo package --all-features
