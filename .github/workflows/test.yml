# The test suite, on the platforms this crate claims to support.
#
# There is deliberately no build-and-release job here. This repository is a
# library: `cargo build --release` produces an `.rlib` nobody downloads, and the
# zip, tarball and `.deb` this workflow used to publish were for a `zond` binary
# that no target in this repository builds. They belong to the CLI, which is a
# separate repository with its own release.
#
# A library's release is `cargo publish`, and that is deliberately not automated
# here — pushing a version to crates.io is irreversible, and it should be a
# person's decision rather than a side effect of tagging. What this workflow does
# instead is check, on every change, that the crate *could* be published: see the
# packaging job.
#
# Linux and macOS only. Windows is unsupported and its checks are not run here.
name: Test

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "assets/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "assets/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test.yml"

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      # `--all-features` rather than a bare `cargo test`: the export and import
      # formats are each behind a feature, and a suite that only ever runs the
      # default set leaves most of them compiled but never executed.
      - name: Run tests
        run: cargo test --all-features

      # The `#[ignore]`d tests need a real kernel and capture access, which the
      # GitHub runners do not give reliably. They run off-CI on a privileged
      # Linux host; a CI job for them can come back once that is set up.

  # Tier 3, which needs a Linux kernel and gets one here.
  #
  # It is its own job rather than a line in the matrix so that the tier has a
  # status of its own in the checks list. A gate whose result is folded into a
  # broader green is one nobody looks at, which is the whole argument for the
  # `ZOND_REQUIRE_NETNS` step below.
  namespaced:
    name: Tier 3 (namespaced)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `nftables` is what a test firewalls a port with; the rest of the tier's
      # tools (`ip`, `tc`, `unshare`, `nsenter`) are on the image already.
      - name: Install libpcap and nftables
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev nftables

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      # Ubuntu 24.04 and later ship an AppArmor profile that refuses
      # unprivileged user namespaces to confined programs. The tier needs one,
      # the runner has sudo, and `|| true` covers an image where the knob does
      # not exist rather than failing the job over a missing sysctl.
      - name: Permit unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The tier skips rather than fails on a machine whose policy forbids a
      # namespace, which is right for a workstation and wrong here: the skip
      # and a real pass report the same green. This says the namespace has been
      # arranged, so a skip is a failure.
      - name: Run the tier
        env:
          ZOND_REQUIRE_NETNS: 1
        run: cargo test --all-features --test namespaced

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    # Integration branches (main, feat/main) and every PR; a scratch branch
    # gets only the fast gates.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/main' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned to the exact version `Cargo.toml` declares. Without this the
      # `rust-version` field is an assertion nobody checks, and the README badge
      # advertising it is a promise to strangers made on no evidence.
      - name: Install the declared minimum toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install libpcap
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      # Build rather than test: the question is whether a consumer on this
      # toolchain can compile the crate and everything it exposes. The dev
      # dependencies are the test suite's problem, not theirs.
      - name: Build on the declared minimum
        run: cargo build --all-features

  package:
    name: Publishable
    runs-on: ubuntu-latest
    # Integration branches (main, feat/main) and every PR; a scratch branch
    # gets only the fast gates.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/main' || github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libpcap
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      # Builds the crate from the packaged files rather than from the working
      # tree, which is the only thing that catches a file the package needs and
      # does not carry. `build.rs` compiles the fingerprint signatures out of
      # `assets/`, so an `exclude` that swept those up would produce a crate that
      # fails to build for every consumer and for nobody here.
      #
      # It does not publish. It answers "could this be published", which is a
      # question worth having answered before the day somebody wants to.
      - name: Verify the crate packages and builds from the package
        run: cargo package --all-features
