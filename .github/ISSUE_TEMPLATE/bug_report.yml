name: Bug report
description: The engine crashed, returned an error it shouldn't have, or got a result wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Using the `zond` command rather than the library? Please report it at
        [zond-rs/zond](https://github.com/zond-rs/zond/issues/new/choose) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest code or input that shows it. A report file or a packet capture helps if the network is involved.
      render: rust
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and features
      placeholder: 0.19.0, default features plus export-all
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: privileges
    attributes:
      label: Raw sockets available
      description: Root, CAP_NET_RAW, BPF access on macOS, or Administrator with Npcap on Windows.
      options:
        - "Yes"
        - "No"
        - Not sure
