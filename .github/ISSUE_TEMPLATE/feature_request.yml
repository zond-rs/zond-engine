name: Feature request
description: A capability or an API the engine doesn't have yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, not just the proposed API. There's often more than one way to solve it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: An API sketch, a protocol and its spec, or how another tool does it.
