# Real software, and what this engine should make of it.
#
# `tests/containers.rs` starts each target from its pinned image, scans it
# through the public API, and holds the verdict to what is written here.
#
# To add one: leave `expect` out, run the report pass, read what it printed, and
# write down the part of it you agree with. An expectation copied from a run
# nobody looked at asserts only that the engine still does whatever it did.
#
# `expect` may state any of `service`, `product`, `vendor`, `version`,
# `extrainfo`; a field left out is not checked. `unidentified = true` asserts the
# opposite, so that the day something can be named is a visible change.
#
# ## UDP targets
#
# `protocol = "udp"` scans the target over UDP instead. Two things follow from
# that and neither needs stating per entry:
#
#   * It is published on its own port number rather than a free one. TCP has
#     the generic HTTP probe behind it, so a web application on a random port is
#     still asked something it can answer. UDP has no such fallback: the corpus
#     keys a probe on the destination port, and a service on any other number is
#     sent nothing and reports as `open|filtered`.
#   * Readiness is that it answers the corpus probe, not that a connection
#     succeeds. There is no connection: a container whose socket is not bound
#     yet discards a datagram in silence, which is the same silence a filtered
#     port returns, so the only usable signal is a reply.
#
# An entry whose port the corpus has no UDP probe for is refused rather than
# waited on: the scan would send it nothing either.
#
# Two things learned looking for the first UDP entry, so the next attempt does
# not repeat them:
#
#   * A well-known port may not be publishable. 53 is already allocated on a
#     machine running almost any local resolver, and is privileged besides. The
#     publishable corpus ports are the high ones: 1900, 5060, 5061, 5353.
#   * Not every daemon can answer a unicast probe. `vladgh/minidlna` binds
#     `239.255.255.250:1900`, the multicast group itself, so the kernel never
#     delivers it a unicast datagram and it answers a scan with silence. That is
#     the daemon working as designed, not a defect to chase. See the note in
#     `assets/fingerprinting/network/ssdp.toml`.
#
# So a first UDP entry wants a daemon that binds the wildcard on a high port: a
# SIP server on 5060 is the most likely candidate, and a router IGD stack on
# 1900 the most representative.

[[target]]
name = "jellyfin"
image = "jellyfin/jellyfin:10.10.7"
port = 8096
[target.expect]
service = "http"
product = "Media Server"
vendor = "Jellyfin"

