[package]
name = "zond-engine"
version = "0.13.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
repository = "https://github.com/zond-rs/zond-engine"
documentation = "https://docs.rs/zond-engine"
readme = "README.md"
description = "A lightweight, fast, and highly concurrent networking backend for packet crafting, protocol fingerprinting, and host discovery."
keywords = ["network", "scanner", "portscan", "discovery", "security"]
categories = ["network-programming", "asynchronous"]
# What a published crate does not need to carry.
#
# `audit/` is design records and point-in-time assessments, and `docs/` is
# internal working notes — measurement logs, open defects. Neither is
# user-facing. `audit/` is gitignored as well, so this line is the second of two
# defences rather than the only one; `docs/` is tracked, so for it this line is
# the only thing standing between a working note and crates.io. `.github/` is
# this repository's own CI and belongs to nobody who depends on the crate, and
# `deny.toml` is what that CI holds the dependency tree to.
#
# `assets/` is deliberately *not* excluded: `build.rs` compiles the fingerprint
# signatures out of it, so a package without it does not build at all.
exclude = ["audit/", "docs/", ".github/", "deny.toml", "fuzz/"]

# What docs.rs is asked to build, which is not what it builds by default.
#
# Its default is this crate's default features, which are `export-json` and
# `journal-format` — so every import format, four of the five export formats,
# `ImportError`, `Settings` and `ReportReader` would be absent from the page
# `documentation` above points a stranger at. The lint workflow builds
# `--all-features` and so cannot see that; this is the line that makes the two
# agree.
#
# `--cfg docsrs` turns on the `doc_cfg` feature in `lib.rs`, which is what puts
# "Available on crate feature `export-csv` only" beside an item. Without it a
# reader who finds `CsvExporter` has no way to learn from the documentation that
# it needs a feature at all. Nightly-only, and gated on `docsrs` so no other
# build is asked for it; `doc_auto_cfg` was the name until 1.92 merged it here.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# `docsrs` is set by the stanza above and by nothing else, so every other build
# has to be told it is a name this crate expects rather than a typo.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[features]
default = ["export-json", "journal-format"]

# The scan journal's on-disk format: the framing every scan is written through,
# and the reader `--resume` continues one from. On by default because journalling
# is not opt-in — the whole argument for it is that a user should never have had
# to decide, before a scan started, whether they would want to resume it.
#
# It pulls in `serde_json` and nothing else, and it gates only the format:
# `journal::paths` needs nothing and stays present either way, so a front end can
# locate and list journals without compiling the reader.
journal-format = ["dep:serde_json"]

# Report export as a single JSON document, the canonical output format. On by
# default because a scanner nobody can get results out of is not much of a
# scanner. It pulls in `serde_json` and nothing else; a consumer who only wants
# the live API can turn it off and the `export` module keeps its schema types
# and its `Exporter` trait, which cost only the `serde` already depended on.
export-json = ["dep:serde_json"]

# The same data one record per line: streamable, and a file cut off part way
# through is still readable. Shares `serde_json` and the DTOs with `export-json`,
# so it costs nothing on top of it.
export-jsonl = ["dep:serde_json"]

# A flat table, one row per host and port, for the spreadsheet and compliance
# audience. Adds no dependency at all — the writer is a few dozen lines of RFC
# 4180, and pulling in a CSV crate to emit two dozen columns would cost more than
# it saves.
export-csv = []

# A single self-contained page, for the person who is going to read the report
# rather than parse it, and for the browser that prints it. Adds no dependency:
# the stylesheet is a file in `assets/` and the markup is written directly to
# the destination, because a templating crate for one document costs more than
# it saves.
export-html = []

# Nmap-compatible XML, for the pipelines that already exist. DefectDojo,
# Metasploit, Faraday and Dradis all ingest nmap's XML and none of them ingest
# this crate's JSON, so this is what puts a zond scan into somebody's existing
# workflow. Adds no dependency: the markup is written directly, as `export-html`
# already does, and an XML crate for one document shape would cost more than it
# saves.
export-nmap = []

# Every format this crate ships. A convenience for a front end that wants to
# offer the user a choice, rather than a fifth format.
export-all = ["export-json", "export-jsonl", "export-csv", "export-html", "export-nmap"]

# Reading targets out of a table: a report this engine wrote, or a spreadsheet
# somebody else did. Adds no dependency — the reader is the mirror of the writer
# behind `export-csv`, and a CSV crate would cost more than the two hundred
# lines it saves. Sniffing a table means recognising this crate's own header, and
# the header itself lives in `format::csv`, which either direction compiles in on
# its own; reading a format does not require being able to write it.
import-csv = []

# Reading a report this engine wrote back in as targets, as a JSON document or
# one record per line. Shares `serde_json` with the export side, so it costs
# nothing on top of it. It does *not* reuse the export DTOs: those are borrowing,
# write-only types and the document root is a streaming adapter over
# `&ScanReport`, so there is nothing there to deserialize into. The records it
# reads are written by hand and deliberately narrower — see `import::json`.
import-json = ["dep:serde_json"]

# Defaults and named profiles, read from a TOML document. Adds no dependency:
# `toml` is already unconditional. This is the one feature in the crate whose
# functions can write to a filesystem, and only the one path a caller hands them
# — see `import::settings` for why that boundary is drawn where it is.
import-settings = []

# Reading nmap's XML back in as targets: the file people already have in an
# engagement repository, hosts with the ports found on each. Adds no dependency —
# a hand-rolled subset parser, which is defensible only because it refuses far
# more than it accepts; see `import::nmap`. The round-trip tests need the writer
# too, but they ask for it themselves with a `cfg` rather than making every
# consumer of the reader compile it.
import-nmap = []

# Every format this crate can read. The list format is unconditional and is not
# named here: it needs nothing, and everybody needs it.
import-all = ["import-csv", "import-json", "import-nmap", "import-settings"]

# Exposes `ProbeTransport::from_parts`, `EthernetHandle::from_parts` and
# `PassiveListener::from_parts`, which build a transport over a caller-supplied
# sender and reply stream instead of a socket and a capture — or, for the
# listener, over a frame stream alone, there being no sending half to supply. That
# is what lets a test outside this crate drive a real scanner against a synthetic
# network: no sockets, no privileges, no interfaces.
#
# This gates the *fake* transports and nothing else. Building a strategy by hand
# against a real transport needs no feature at all — see the `scanner::strategy`
# module, whose types and `with_transport` constructors are ordinary public API.
# It adds no dependencies and changes no behaviour, but a synthetic transport has
# no use in a shipped binary: enable it for tests only, never for a release.
test-support = []

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
# The three parts of `pnet` this crate uses, named individually rather than
# through the `pnet` facade.
#
# The facade pulls `pnet_datalink` in with everything else, and that is the crate
# whose Windows backend reports `flags: 0` for every interface — the defect that
# made `is_up()` false on that platform and every entry point here find an empty
# network. Nothing reads it any more: interfaces come from `netdev` through
# `system::interface::Link`, and frames go out through `pcap`, which was already
# open on the same link to receive them.
#
# Naming the parts drops `pnet_datalink` and `ipnetwork` from the tree, and it
# stops the next defect in a part this crate does not use from being this crate's
# problem. `pnet_packet` is what the facade was ever wanted for: it parses and
# builds packets, touches no platform, and is the best thing in the family.
pnet_packet = "0.35.0"
pnet_base = "0.35.0"
# Raw Layer-4 sockets, used only by `transport::raw`. The one piece still to move
# — `socket2` is already here and would do it — and not urgent, because Windows
# blocks raw TCP sends outright and `SendMode::Auto` picks Ethernet there.
pnet_transport = "0.35.0"
pcap = "2.2.0"
libc = "0.2"
netdev = "0.38.0"
# The one place the engine binds a socket with options `std` does not expose:
# joining the mDNS multicast group and reusing port 5353 alongside the host's
# own responder, which needs `SO_REUSEADDR`/`SO_REUSEPORT` set before the bind.
# Declared rather than hand-rolled through `libc`, on the same reasoning as
# `ring` below: `tokio` already pins this exact version, so this names a crate
# the build compiles either way, where reimplementing `setsockopt` for macOS and
# Linux by hand would put platform-divergent unsafe code in the tree for one
# call site. The bound `std` socket is handed straight to `tokio`, so socket2 is
# confined to the few lines that configure it.
socket2 = "0.6"
rand = "0.10.2"
thiserror = "2.0.19"
rayon = "1.12.0"
tracing = "0.1.44"
tokio = { version = "1.53.0", features = ["full"] }
hickory-resolver = { version = "0.26.1", features = ["tokio"] }
dashmap = "6.1.0"
mac_oui = { version = "0.4.11", features = ["with-db"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
bincode = "1.3.3"
dns-parser = "0.8"
toml = "1.1.3"
regex = "1.13.1"
regex-syntax = "0.8"
fancy-regex = "0.19.0"
aho-corasick = "1.1"
rhai = { version = "1.26.0", features = ["sync"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18.1"
# SHA-256 for certificate fingerprints, and nothing else. Declared rather than
# vendored because `rustls` already pins its `ring` crypto provider, so this
# names a crate the build compiles either way: it costs no extra compilation and
# no new supply chain, where hand-rolling the digest would put a cryptographic
# primitive in this repository for one call site.
ring = "0.17"

# Declared per-target rather than unconditionally, as the CLI already declares
# its own `rustix`. It compiles to nothing off Windows either way, so this buys
# no build time; what it buys is that the manifest says which platform the
# dependency is for, and a feature added for one call site cannot be mistaken
# for something every build needs.
#
# One feature per subsystem this crate actually calls into. `windows-sys` gates
# every module behind one, so a missing feature is not a smaller build — it is
# `cannot find X in Y` on a platform nobody compiled for. That is precisely how
# `Win32_System_SystemInformation` came to be missing while `journal::lock` was
# already calling `GetTickCount64`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    # Interface and neighbour tables.
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    # SYSTEMTIME, HANDLE, and the handle-closing this crate does after a token.
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    # Elevation, via the process token.
    "Win32_Security",
    "Win32_System_Threading",
    # `GetTickCount64`, which is how a journal lock recognises a reboot.
    "Win32_System_SystemInformation",
    # `SystemTimeToTzSpecificLocalTime`, which is how a local time gets an
    # offset on a platform with no `tm_gmtoff`.
    "Win32_System_Time",
] }

[dev-dependencies]
# A JSON Schema validator, used only to hold the exported document to
# `assets/schema/zond-report-v1.schema.json`. That schema is the contract
# consumers parse against, and a contract nothing checks drifts from the code
# within a release. Chosen over `jsonschema`, which is the better-known crate
# but pulls in an HTTP client and a TLS stack by default to fetch remote
# references — neither of which a scanner's test suite has any business
# building.
boon = "0.6.1"
proptest = "1.6.0"
# The library emits `tracing` events but installs no subscriber, leaving that to
# the consumer. The benchmark example needs one to see the scanners' own audit
# lines, so it carries the collector here rather than in the library's own
# dependency set.
tracing-subscriber = "0.3"
# A dev-dependency on this crate itself, which is how the integration tests in
# `tests/` get a build of the library with `test-support` turned on. Cargo
# unifies it with the library target, so nothing is compiled twice and the
# feature stays off for every downstream consumer.
zond-engine = { path = ".", features = ["test-support", "export-all", "import-all"] }

[build-dependencies]
bincode = "1.3.3"
dns-parser = "0.8"
regex = "1.13.1"
fancy-regex = "0.19.0"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
toml = "1.1.2"
