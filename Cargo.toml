[package]
name = "zond-engine"
version = "0.10.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/zond-rs/zond-engine"
description = "A lightweight, fast, and highly concurrent networking backend for packet crafting, protocol fingerprinting, and host discovery."

[features]
default = ["export-json"]

# Report export as a single JSON document, the canonical output format. On by
# default because a scanner nobody can get results out of is not much of a
# scanner. It pulls in `serde_json` and nothing else; a consumer who only wants
# the live API can turn it off and the `export` module keeps its schema types
# and its `Exporter` trait, which cost only the `serde` already depended on.
export-json = ["dep:serde_json"]

# The same data one record per line: streamable, and a file cut off part way
# through is still readable. Shares `serde_json` and the DTOs with `export-json`,
# so it costs nothing on top of it.
export-jsonl = ["dep:serde_json"]

# A flat table, one row per host and port, for the spreadsheet and compliance
# audience. Adds no dependency at all — the writer is a few dozen lines of RFC
# 4180, and pulling in a CSV crate to emit two dozen columns would cost more than
# it saves.
export-csv = []

# A single self-contained page, for the person who is going to read the report
# rather than parse it, and for the browser that prints it. Adds no dependency:
# the stylesheet is a file in `assets/` and the markup is written directly to
# the destination, because a templating crate for one document costs more than
# it saves.
export-html = []

# Nmap-compatible XML, for the pipelines that already exist. DefectDojo,
# Metasploit, Faraday and Dradis all ingest nmap's XML and none of them ingest
# this crate's JSON, so this is what puts a zond scan into somebody's existing
# workflow. Adds no dependency: the markup is written directly, as `export-html`
# already does, and an XML crate for one document shape would cost more than it
# saves.
export-nmap = []

# Every format this crate ships. A convenience for a front end that wants to
# offer the user a choice, rather than a fifth format.
export-all = ["export-json", "export-jsonl", "export-csv", "export-html", "export-nmap"]

# Reading targets out of a table: a report this engine wrote, or a spreadsheet
# somebody else did. Adds no dependency — the reader is the mirror of the writer
# behind `export-csv`, and a CSV crate would cost more than the two hundred
# lines it saves. It turns `export-csv` on because sniffing a table recognises
# this crate's own header, which means knowing what that header is.
import-csv = ["export-csv"]

# Reading a report this engine wrote back in as targets, as a JSON document or
# one record per line. Shares `serde_json` with the export side, so it costs
# nothing on top of it. It does *not* reuse the export DTOs: those are borrowing,
# write-only types and the document root is a streaming adapter over
# `&ScanReport`, so there is nothing there to deserialize into. The records it
# reads are written by hand and deliberately narrower — see `import::json`.
import-json = ["dep:serde_json"]

# Every format this crate can read. The list format is unconditional and is not
# named here: it needs nothing, and everybody needs it.
import-all = ["import-csv", "import-json"]

# Exposes `ProbeTransport::from_parts`, which builds a transport over a caller-
# supplied sender and reply stream instead of a socket and a capture. That is
# what lets an integration test outside this crate drive a scanner against a
# synthetic network. It adds no dependencies and changes no behaviour, but it is
# not part of the supported API: enable it for tests only, never for a release.
test-support = []

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
pnet = "0.35.0"
pcap = "2.2.0"
libc = "0.2"
netdev = "0.38.0"
rand = "0.10.2"
thiserror = "2.0.19"
rayon = "1.12.0"
tracing = "0.1.44"
tokio = { version = "1.53.0", features = ["full"] }
hickory-resolver = { version = "0.26.1", features = ["tokio"] }
dashmap = "6.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis", "Win32_Security", "Win32_System_Threading"] }
mac_oui = { version = "0.4.11", features = ["with-db"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
bincode = "1.3.3"
dns-parser = "0.8"
toml = "1.1.3+spec-1.1.0"
regex = "1.13.1"
regex-syntax = "0.8"
fancy-regex = "0.19.0"
aho-corasick = "1.1"
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18.1"

[dev-dependencies]
# A JSON Schema validator, used only to hold the exported document to
# `assets/schema/zond-report-v1.schema.json`. That schema is the contract
# consumers parse against, and a contract nothing checks drifts from the code
# within a release. Chosen over `jsonschema`, which is the better-known crate
# but pulls in an HTTP client and a TLS stack by default to fetch remote
# references — neither of which a scanner's test suite has any business
# building.
boon = "0.6.1"
proptest = "1.6.0"
# The library emits `tracing` events but installs no subscriber, leaving that to
# the consumer. The benchmark example needs one to see the scanners' own audit
# lines, so it carries the collector here rather than in the library's own
# dependency set.
tracing-subscriber = "0.3"
# A dev-dependency on this crate itself, which is how the integration tests in
# `tests/` get a build of the library with `test-support` turned on. Cargo
# unifies it with the library target, so nothing is compiled twice and the
# feature stays off for every downstream consumer.
zond-engine = { path = ".", features = ["test-support", "export-all", "import-all"] }

[build-dependencies]
bincode = "1.3.3"
dns-parser = "0.8"
regex = "1.13.1"
fancy-regex = "0.19.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
