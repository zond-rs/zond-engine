[package]
name = "zond-engine"
version = "0.19.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
repository = "https://github.com/zond-rs/zond-engine"
documentation = "https://docs.rs/zond-engine"
homepage = "https://zond.rs"
readme = "README.md"
description = "The core networking library powering Zond. Raw packet injection, protocol parsing, service and OS fingerprinting, and asynchronous network scanning."
keywords = ["network", "scanner", "portscan", "discovery", "security"]
categories = ["network-programming", "asynchronous"]
exclude = ["audit/", "todo/", "docs/", ".github/", "deny.toml", "fuzz/", "tests/data/distro/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[features]
default = ["export-json", "journal-format"]

journal-format = ["dep:serde_json"]
export-json = ["dep:serde_json"]
import-kev = ["dep:serde_json"]
import-nvd = ["dep:serde_json"]
import-distro = ["dep:serde_json", "dep:tar", "dep:liblzma"]
export-jsonl = ["dep:serde_json"]
export-csv = []
export-html = []
export-nmap = []
export-all = ["export-json", "export-jsonl", "export-csv", "export-html", "export-nmap"]
import-csv = []
import-json = ["dep:serde_json"]
import-settings = []
import-nmap = []
import-request = ["import-settings"]
import-all = ["import-csv", "import-json", "import-nmap", "import-request", "import-settings"]
packet-exchange = []
test-support = []
fetch = ["journal-format", "dep:reqwest", "dep:rustls-platform-verifier"]

[dependencies]
async-trait = "0.1.91"
pnet_packet = "0.35.0"
pnet_base = "0.35.0"
pnet_transport = "0.35.0"
pcap = "2.2.0"
libc = "0.2"
netdev = "0.38.0"
socket2 = { version = "0.6", features = ["all"] }
rand = "0.10.2"
thiserror = "2.0.19"
rayon = "1.12.0"
tracing = "0.1.44"
tokio = { version = "1.53.0", features = ["full"] }
hickory-resolver = { version = "0.26.1", features = ["tokio"] }
dashmap = "6.1.0"
mac_oui = { version = "0.4.11", features = ["with-db"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
serde_json = { version = "1.0.151", optional = true }
bincode = "1.3.3"
dns-parser = "0.8"
toml = "1.1.3"
regex = "1.13.1"
regex-syntax = "0.8"
fancy-regex = "0.19.0"
aho-corasick = "1.1"
rhai = { version = "1.26.0", features = ["sync"] }
data-encoding = "2.10.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18.1"
ring = "0.17"

reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"], optional = true }
rustls-platform-verifier = { version = "0.7.1", optional = true }

md-5 = "0.10.6"
tar = { version = "0.4.46", default-features = false, optional = true }
liblzma = { version = "0.4.8", features = ["static"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[dev-dependencies]
boon = "0.6.1"
proptest = "1.6.0"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
zond-engine = { path = ".", features = ["test-support", "export-all", "import-all", "packet-exchange"] }

[build-dependencies]
bincode = "1.3.3"
dns-parser = "0.8"
regex = "1.13.1"
fancy-regex = "0.19.0"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
toml = "1.1.2"

[[example]]
name = "nvd_catalogue"
required-features = ["import-nvd"]

[[example]]
name = "kev_list"
required-features = ["import-kev"]
