# The fuzzing harnesses, as a crate of their own.
#
# Separate because `libfuzzer-sys` links a runtime that replaces `main` and needs
# a nightly toolchain and a sanitizer, none of which the library or its suite
# should have to carry. `[workspace]` detaches this from the parent so a plain
# `cargo build` at the repository root never reaches it.
#
# `cargo fuzz run <target>` from the repository root; `cargo fuzz list` names
# them. Tracked here: this file, `README.md`, `fuzz_targets/` and `seeds/`.
# Everything else under `fuzz/` is what a run produces and is gitignored.
[package]
name = "zond-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

# The oracles more than one target asks. A target with nothing to assert finds a
# panic and no more, and three of these read a document into a `ScanReport`,
# where the questions worth asking are the same whichever reader built it.
[lib]
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
# Used by `export_report` alone, to say that what the JSON writers emit is JSON.
# The library's own parser would be the wrong instrument: it reads the schema,
# and the question here is the one below that.
serde_json = "1"

# Every reader and every writer, because a target per surface needs the surface
# compiled in. `journal-format` is named rather than left to the default set: the
# journal targets do not compile without it, and a default is something a
# consumer can turn off. `test-support` is deliberately absent: it swaps a real
# transport for a synthetic one, and nothing here goes near a transport.
[dependencies.zond-engine]
path = ".."
features = ["import-all", "export-all", "journal-format"]

# ---------------------------------------------------------------------------
# Targets
#
# Named `<surface>_<what>`, and laid out under `fuzz_targets/<surface>/`, so
# that `cargo fuzz list` groups them and a new one has an obvious home. The
# surface is the boundary the target attacks, not the module it happens to call:
# `export_report` reaches the writers by way of a reader, and it is an export
# target because a writer is what it is asserting about.
# ---------------------------------------------------------------------------

# Bytes off the wire.
[[bin]]
name = "wire_ethernet_frame"
path = "fuzz_targets/wire/ethernet_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_buffer"
path = "fuzz_targets/wire/buffer.rs"
test = false
doc = false
bench = false

# Files somebody else wrote.
[[bin]]
name = "import_targets"
path = "fuzz_targets/import/targets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_report"
path = "fuzz_targets/import/report.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_nmap"
path = "fuzz_targets/import/nmap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_settings"
path = "fuzz_targets/import/settings.rs"
test = false
doc = false
bench = false

# What this crate writes, and whether it can read it back.
[[bin]]
name = "export_report"
path = "fuzz_targets/export/report.rs"
test = false
doc = false
bench = false

# The contract both directions share.
[[bin]]
name = "format_timestamp"
path = "fuzz_targets/format/timestamp.rs"
test = false
doc = false
bench = false

# The boundary between a type with invariants and a file that holds it.
[[bin]]
name = "record_host"
path = "fuzz_targets/record/host.rs"
test = false
doc = false
bench = false

# What a scan writes down as it runs, and what a resume trusts. Three targets,
# because a journal is three questions that fail differently: whether the file
# can be read at all, whether the number in it means what a second sitting will
# take it to mean, and whether the plan it names is still the plan.
[[bin]]
name = "journal_framing"
path = "fuzz_targets/journal/framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_cursor"
path = "fuzz_targets/journal/cursor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_manifest"
path = "fuzz_targets/journal/manifest.rs"
test = false
doc = false
bench = false

# Two scans against each other, and several folded into one. Both take reports
# rather than bytes, so both reach their subject through a reader — the same
# arrangement `export_report` makes, for the same reason.
[[bin]]
name = "diff_reports"
path = "fuzz_targets/diff/reports.rs"
test = false
doc = false
bench = false

[[bin]]
name = "merge_reports"
path = "fuzz_targets/merge/reports.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fingerprint_certificate"
path = "fuzz_targets/fingerprint/certificate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fingerprint_banner"
path = "fuzz_targets/fingerprint/banner.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fingerprint_stack"
path = "fuzz_targets/fingerprint/stack.rs"
test = false
doc = false
bench = false
