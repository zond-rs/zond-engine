[package]
name = "zond-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]
[lib]
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
serde_json = "1"

[dependencies.zond-engine]
path = ".."
features = ["import-all", "export-all", "journal-format", "packet-exchange"]

[[bin]]
name = "protocols_craft"
path = "fuzz_targets/protocols/craft.rs"
test = false
doc = false
bench = false

